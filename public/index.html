<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Full Track POS · Sistema de Gestión Food Truck</title>

<link rel="stylesheet" href="vendor/tailwind.css">
<link rel="stylesheet" href="mobile-responsive.css">
<script src="vendor/chart.umd.min.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/jspdf.plugin.autotable.min.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<!-- QZ Tray: puente local para imprimir directo a una impresora específica sin el diálogo del navegador.
     Requiere que el usuario instale la app gratuita QZ Tray (https://qz.io/download/) en la computadora
     que imprime. Si no está instalada o no carga, el sistema sigue funcionando con impresión normal. -->
<script src="vendor/rsvp.js"></script>
<script src="vendor/sha256.min.js"></script>
<script src="vendor/qz-tray.js"></script>

<!-- API Adapter para web version: proporciona window.storage y window.nativePrint usando fetch() -->
<script src="api-adapter.js"></script>

<!-- Tipografías: se usan de sistema para que la app funcione sin internet.
     Si más adelante quieres las fuentes originales (Big Shoulders Display / Inter / JetBrains Mono),
     descarga los .woff2 y agrégalos aquí con @font-face — ver README del proyecto. -->

<style>
  /* ================= PALETA — rojo / blanco / carbón, sin degradados ================= */
  :root{
    --bg:#F6F3EC; --surface:#FFFFFF; --surface-2:#F1ECE0; --surface-3:#E9E2D2;
    --line:#DFD6C0; --ink:#1C1814; --muted:#7C7360;
    --red:#C81E2B; --red-deep:#8F1420; --red-tint:#FBE6E4;
    --charcoal:#2A241D; --accent:#A9812F; --basil:#1F8E63; --danger:#C81E2B;
  }
  .light-alt{}
  .dark{
    --bg:#141210; --surface:#1E1A15; --surface-2:#25201A; --surface-3:#2C261F;
    --line:#38312A; --ink:#F3EFE4; --muted:#A79C89;
    --red:#E23B44; --red-deep:#B21F29; --red-tint:#3A1815;
    --charcoal:#F3EFE4; --accent:#D4B15C; --basil:#3FCB93; --danger:#E23B44;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif}
  .font-display{font-family:'Big Shoulders Display',sans-serif;font-weight:800;letter-spacing:.01em;font-variant-numeric:tabular-nums}
  .font-mono{font-family:'JetBrains Mono',monospace}
  .surface{background:var(--surface);border:1px solid var(--line)}
  .surface-2{background:var(--surface-2);border:1px solid var(--line)}
  .surface-3{background:var(--surface-3)}
  .text-muted{color:var(--muted)}
  .ember{color:var(--red)}
  .basil{color:var(--basil)}
  .gold{color:var(--accent)}
  .bg-ember{background:var(--red)}
  .border-line{border-color:var(--line)}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
  .tile{transition:transform .12s ease, border-color .12s ease}
  .tile:active{transform:scale(.96)}
  .tile:hover{border-color:var(--red)}
  .nav-item{transition:background .15s ease,color .15s ease;border-left:3px solid transparent}
  .nav-item.active{background:var(--red);color:#fff;border-left-color:var(--red-deep)}
  @keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .rise{animation:riseIn .35s ease both}
  @keyframes modalIn{from{opacity:0;transform:scale(.95) translateY(6px)}to{opacity:1;transform:scale(1) translateY(0)}}
  .modal-anim{animation:modalIn .2s ease both}
  .toast{animation:riseIn .25s ease both}
  input,select,textarea{background:var(--surface-3);border:1px solid var(--line);color:var(--ink);outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--red)}
  input::placeholder{color:var(--muted)}
  .badge{font-family:'JetBrains Mono',monospace;letter-spacing:.03em}
  .scrollbar-none::-webkit-scrollbar{display:none}
  .table-card{transition:border-color .15s ease}
  .table-card.disponible{border-color:var(--basil)}
  .table-card.ocupada{border-color:var(--red)}
  .tab-btn{border-bottom:2px solid transparent}
  .tab-btn.active{color:var(--red);border-color:var(--red)}
  .rule-top{border-top:3px solid var(--red)}
  /* borde perforado tipo recibo — elemento de identidad visual */
  .receipt-edge{position:relative}
  .receipt-edge::after{
    content:'';position:absolute;left:0;right:0;bottom:-9px;height:10px;
    background-image:radial-gradient(circle at 6px 5px, transparent 5px, var(--bg) 5.5px);
    background-size:12px 10px;background-repeat:repeat-x;
  }
  /* Venta Rápida (POS): esta hoja de estilos es una build de Tailwind ya "purgada" —
     solo incluye las clases que se usaban en el archivo original — así que el layout de
     dos columnas y algunos detalles nuevos se definen aquí a mano en vez de con clases de
     utilidad de Tailwind que no vendrían incluidas en el CSS. */
  .pos-layout{display:flex;flex-direction:column;gap:1.25rem;height:100%}
  .pos-products{min-height:0;min-width:0;display:flex;flex-direction:column}
  .pos-order{min-height:280px;min-width:0}
  /* A 768px (tablet chico) ya se parte en dos columnas independientes con su propio scroll
     cada una — antes solo pasaba desde 1024px, así que en pantallas más angostas (tablets,
     ventanas no maximizadas) todo quedaba apilado en una sola columna larga: para armar un
     pedido de mesa grande había que desplazarse por TODOS los productos antes de llegar al
     carrito, y el carrito no tenía su propio espacio de scroll. */
  @media(min-width:768px){
    .pos-layout{flex-direction:row;height:100%}
    .pos-products{flex:3 1 0%}
    .pos-order{flex:2 1 0%;min-height:0}
  }
  /* Grilla de método de pago: se acomoda sola según el ancho disponible (en vez de forzar
     4 columnas fijas que se apretaban o desbordaban en paneles angostos). */
  .pm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px}
  .note-add-btn{border:1px dashed var(--line)}
  /* Filas de "chips" (categorías, mesas): se envuelven en varias líneas en vez de exigir
     deslizar de lado — en una pantalla táctil, deslizar para descubrir que hay más opciones
     no es obvio; ver todas las opciones de una vez es más simple. */
  .pill-wrap{display:flex;flex-wrap:wrap;gap:8px}
  #printArea{display:none}
  @media print{
    body *{visibility:hidden}
    #printArea, #printArea *{visibility:visible}
    #printArea{display:block !important;position:absolute;top:0;left:0;width:80mm;padding:3mm;color:#000;background:#fff;font-family:'JetBrains Mono',monospace}
    @page{size:80mm auto;margin:0}
  }
</style>
</head>
<body class="min-h-screen">

<div id="app" class="flex h-screen overflow-hidden"></div>
<div id="printArea"></div>

let state = JSON.parse(JSON.stringify(DEFAULT_STATE));
let ORDER_COUNTER = 1;
let sessionActive = false; // siempre exige contraseña al abrir el sistema

async function loadState(){
  /* Si no existe window.storage, esto NO se está ejecutando dentro de la app de Electron
     instalada — se abrió el archivo index.html directamente en un navegador. En ese caso
     no hay forma de guardar nada en el disco, así que avisamos claro en vez de dejar que
     el programa "funcione" en apariencia y luego se resetee cada vez que se cierra. */
  if(!window.storage || typeof window.storage.get !== 'function'){
    document.getElementById('app').innerHTML = `
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#141414;color:#fff;padding:24px;font-family:sans-serif;">
        <div style="max-width:520px;text-align:center;">
          <div style="font-size:40px;margin-bottom:12px;">⚠️</div>
          <div style="font-size:20px;font-weight:700;margin-bottom:12px;">Esto se abrió directamente en el navegador</div>
          <div style="font-size:14px;line-height:1.6;color:#ccc;margin-bottom:16px;">
            Estás viendo el archivo <code>index.html</code> suelto, no el programa instalado. Así <b>ningún dato se guarda</b> — por eso pide configurar el negocio cada vez.
          </div>
          <div style="font-size:14px;line-height:1.6;color:#ccc;text-align:left;background:#1f1f1f;border-radius:10px;padding:16px;">
            Para usarlo de verdad:<br>1. Abre la terminal en la carpeta del proyecto<br>2. Corre <code>npm install</code> y luego <code>npm run dist</code><br>3. Abre la carpeta <code>dist</code> y ejecuta el instalador (.exe)<br>4. Ábrelo desde el ícono que quedó instalado — NO desde este archivo index.html
          </div>
        </div>
      </div>`;
    return;
  }
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      state = deepMerge(JSON.parse(JSON.stringify(DEFAULT_STATE)), parsed);
      const maxOrder = state.sales.reduce((m,s)=>Math.max(m, s.orderNumber||0), 0);
      ORDER_COUNTER = maxOrder + 1;
    }
  }catch(e){ /* primera vez */ }
  render();
}
function deepMerge(base, override){
  const out = {...base};
  for(const k in override){
    if(Array.isArray(override[k])) out[k] = override[k];
    else if(typeof override[k]==='object' && override[k]!==null) out[k] = {...base[k], ...override[k]};
    else out[k] = override[k];
  }
  return out;
}
let saveTimer = null;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{ try{ await window.storage.set(STORAGE_KEY, JSON.stringify(state), false); }catch(e){ console.error(e); } }, 150);
}

function clearDemoData(){
  state.products = state.products.filter(p=>!p.demo);
  state.categories = state.categories.filter(c=>!c.demo);
  state.customers = state.customers.filter(c=>!c.demo);
  state.tables.forEach(t=>{ if(t.demo && t.currentSaleId){ t.currentSaleId=null; } });
  state.tables = state.tables.filter(t=>!t.demo);
  state.sales = state.sales.filter(s=>!s.demo);
  state.shifts = state.shifts.filter(s=>!s.demo);
  state.settings.demoDataLoaded = false;
  saveState();
}

function animateNumber(el, to, prefix='', decimals=0){
  if(!el) return; const dur = 900; const start = performance.now();
  function step(now){ const p = Math.min(1,(now-start)/dur); const eased = 1-Math.pow(1-p,3);
    el.textContent = prefix + (to*eased).toFixed(decimals).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    if(p<1) requestAnimationFrame(step); }
  requestAnimationFrame(step);
}

   ========================================================================= */
function adjustStock(productId, qtyChange, type, reason){
  const p = state.products.find(x=>x.id===productId);
  if(!p || !p.trackInventory || !qtyChange) return;
  p.stock = Math.round(((p.stock||0) + qtyChange) * 1000) / 1000;
  state.inventoryMovements.push({ id: uid('mov'), productId, productName: p.name, qtyChange, type, reason: reason||'', date: new Date().toISOString(), userId: state.settings.currentUserId, userName: state.settings.currentUserName });
  if(state.inventoryMovements.length > 1000) state.inventoryMovements = state.inventoryMovements.slice(-1000);
}
function lowStockProducts(){ return state.products.filter(p=>p.trackInventory && p.stock <= p.minStock); }

/* Cancelación de orden con reversión automática de inventario (corrección de auditoría:
   antes, cancelar un pedido de mesa no cobrado dejaba el stock descontado sin reponer). */
function cancelOrder(sale, reason){
  if(!sale || sale.status==='cancelada') return;
  sale.items.forEach(i=> adjustStock(i.id, i.qty, 'ajuste', `Cancelación orden #${sale.orderNumber}${reason?' · '+reason:''}`));
  sale.status = 'cancelada';
  if(sale.tableId){ const t = state.tables.find(x=>x.id===sale.tableId); if(t && t.currentSaleId===sale.id){ t.status='disponible'; t.currentSaleId=null; } }
  logAudit('orden_cancelada', `Orden #${sale.orderNumber} · ${fmt(sale.total)}${reason?' · '+reason:''}`);
  saveState();
}

   seguir vendiendo, salvo autorización de un administrador, para no desvirtuar la cuadratura diaria. */
function shiftIsStale(shift){ if(!shift) return false; return (Date.now() - new Date(shift.openedAt).getTime()) > 24*60*60*1000; }

/* Corrección de auditoría: validar límite de crédito por cliente antes de permitir una nueva venta a fiado. */
function customerOwed(customerId){ return state.sales.filter(s=>s.customerId===customerId && s.fiado && !s.paid && s.status!=='cancelada').reduce((a,s)=>a+s.total,0); }
function creditCheck(customer, newAmount){
  if(!customer) return { ok:false, msg:'Selecciona un cliente para dejar la cuenta a crédito' };
  const limit = customer.creditLimit || 0;
  if(limit > 0 && customerOwed(customer.id) + newAmount > limit + 0.001){
    return { ok:false, msg:`${customer.name} superaría su límite de crédito de ${fmt(limit)} (ya debe ${fmt(customerOwed(customer.id))})` };
  }
  return { ok:true };
}

function cashContribution(sale){
  if(!sale.paid || !sale.payment) return 0;
  if(sale.payment.method==='Efectivo') return sale.total + (sale.tip||0);
  if(sale.payment.method==='Mixto') return sale.payment.breakdown?.efectivo || 0;
  return 0;
}

function tipsTotal(sales){ return round2((sales||[]).reduce((a,s)=>a+(s.tip||0),0)); }
function discountsTotal(sales){ return round2((sales||[]).reduce((a,s)=>a+(s.discount?.amount||0)+(s.pointsRedeemedValue||0),0)); }
function deliveryCommissionsTotal(sales){ return round2((sales||[]).reduce((a,s)=>a+(s.commissionAmount||0),0)); }
function paymentTotals(sales){
  const b = {}; const add=(k,v)=>{ b[k]=(b[k]||0)+v; };
  sales.forEach(s=>{
    if(!s.paid || !s.payment) return;
    if(s.payment.method==='Mixto'){
      if(s.payment.breakdown?.efectivo) add('Efectivo', s.payment.breakdown.efectivo);
      if(s.payment.breakdown?.tarjeta) add('Tarjeta', s.payment.breakdown.tarjeta);
      if(s.payment.breakdown?.transferencia) add('Transferencia (mixto)', s.payment.breakdown.transferencia);
    } else { add(s.payment.method, s.total); }
  });
  return b;
}
function bankTotals(sales){
  const b = {}; sales.forEach(s=>{ if(s.paid && s.payment?.bank) b[s.payment.bank] = (b[s.payment.bank]||0) + s.total; });
  return b;
}

function openModal(title, bodyHtml, opts={}){

      </div>
      <div id="modalBody" class="p-5 overflow-y-auto">${bodyHtml}</div>
    </div>`;
  document.body.appendChild(overlay);
  if(!opts.noClose){
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });
    overlay.querySelector('[data-modal-close]').addEventListener('click', closeModal);

/* Actualiza un modal YA ABIERTO en su lugar (mismo título/ancho/contenido) en vez de cerrarlo
   y volver a abrirlo. Cerrar+reabrir destruye el overlay oscuro de fondo y lo vuelve a crear,
   lo que se veía como un parpadeo a negro cada vez que se cambiaba un dato (cliente, mesa,
   método de pago…) dentro de un flujo con varios pasos. Se usa solo en flujos que reabren su
   propio modal repetidamente (Continuar pedido, selector de mesa, nuevo cliente); si no hay
   ningún modal abierto todavía, simplemente abre uno nuevo como siempre. */
function updateModalInPlace(title, bodyHtml, opts={}){
  const ov = document.getElementById('modalOverlay');
  if(!ov) return openModal(title, bodyHtml, opts);
  const box = ov.querySelector('.modal-anim');
  if(box){ box.classList.toggle('max-w-2xl', !!opts.wide); box.classList.toggle('max-w-md', !opts.wide); }
  const titleEl = document.getElementById('modalTitle');
  if(titleEl) titleEl.textContent = title;
  const mb = document.getElementById('modalBody');
  if(mb) mb.innerHTML = bodyHtml;
  return ov;
}

/* Redimensiona una foto subida por el usuario a un tamaño razonable antes de guardarla como base64,
   para que el archivo de datos local no crezca sin control con fotos de cámara de varios MB. */
function resizeImageToBase64(file, maxDim, cb){
  const reader = new FileReader();
  reader.onerror = ()=> showToast('No se pudo leer esa imagen. Intenta con otra foto.', 'danger');
  reader.onload = (ev)=>{
    const img = new Image();
    img.onerror = ()=> showToast('Ese archivo no parece ser una imagen válida.', 'danger');
    img.onload = ()=>{
      let { width, height } = img;
      if(width > maxDim || height > maxDim){
        if(width > height){ height = Math.round(height * maxDim/width); width = maxDim; }
        else { width = Math.round(width * maxDim/height); height = maxDim; }
      }
      const canvas = document.createElement('canvas'); canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      cb(canvas.toDataURL('image/jpeg', 0.82));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function renderLogin(){
  const app = document.getElementById('app');
  app.className = 'flex h-screen overflow-hidden items-center justify-center';
  const logo = state.settings.logoImage ? `<img src="${state.settings.logoImage}" class="w-16 h-16 rounded-xl object-cover mx-auto">`
    : `<div class="w-16 h-16 rounded-xl bg-ember flex items-center justify-center text-3xl mx-auto text-white">${state.settings.logoEmoji}</div>`;
  app.innerHTML = `
    <div class="w-full max-w-sm surface rounded-xl p-8 rule-top rise">
      ${logo}
      <div class="font-display text-2xl text-center mt-4">${esc(state.settings.businessName)}</div>
      <div class="text-xs text-muted text-center mb-6 uppercase tracking-wide">Inicia sesión para continuar</div>
      ${field('Usuario', `<input id="loginUser" class="${inputCls}" placeholder="admin">`)}
      ${field('Contraseña', `<input id="loginPass" type="password" class="${inputCls}" placeholder="••••••">`)}
      <button id="loginBtn" class="w-full py-2.5 rounded-lg bg-ember text-white font-semibold text-sm mt-2">Ingresar</button>
      <div id="loginError" class="text-xs text-center mt-3" style="color:var(--danger)"></div>
      <div class="text-[11px] text-muted text-center mt-5">Usuario por defecto: <span class="font-mono">admin / admin123</span></div>
    </div>
  `;
  const attempt = ()=>{
    const u = document.getElementById('loginUser').value.trim();
    const p = document.getElementById('loginPass').value;
    const user = state.users.find(x=>x.username===u && x.password===p);
    if(!user){ document.getElementById('loginError').textContent = 'Usuario o contraseña incorrectos'; return; }
    state.settings.currentRole = user.role; state.settings.currentUserId = user.id; state.settings.currentUserName = user.name;
    sessionActive = true; saveState(); currentView='dashboard'; render();
    if(!state.settings.onboarded && user.role==='admin') maybeShowOnboarding(); else maybePromptOpenShift();
  };
  document.getElementById('loginBtn').addEventListener('click', attempt);
  document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') attempt(); });
}
function logout(){ downloadBackup('cierre-sesion'); sessionActive = false; render(); }

   (mientras se escribe un descuento, puntos o propina) sin reconstruir el formulario entero

function posTotalsHTML(subtotal, discountAmount, pointsDiscount, tipAmount, afterDiscount, amountDue){

      ${tipAmount>0?`<div class="flex justify-between"><span>Propina</span><span class="font-mono">+${fmt(tipAmount)}</span></div>`:''}

  `;

function recomputePosTotals(){
  const wrap = document.getElementById('posTotalsWrap');
  if(!wrap) return;
  const customer = state.customers.find(c=>c.id===posSelectedCustomerId);
  /* Las órdenes de mesa NO aplican descuento/canje aquí — eso se decide al cobrar la cuenta
     (openPaymentModal), no al mandar el pedido a cocina. Forzar esto en 0 evita que un
     descuento tecleado antes de elegir mesa se "cuele" en una orden que no debía llevarlo. */
  const isTable = !!posSelectedTableId;
  const subtotal = round2(cart.reduce((a,i)=>a+i.price*i.qty,0));
  const discountAmount = isTable ? 0 : round2(Math.min(subtotal, posDiscountType==='percent' ? subtotal*((posDiscountValue||0)/100) : (posDiscountValue||0)));
  const pointsDiscount = (!isTable && customer && !customer.loyaltyExempt && state.settings.loyaltyEnabled) ? round2(Math.min((Math.min(posRedeemPoints||0, customer.points||0))*(state.settings.loyaltyPointValue||0), Math.max(0,subtotal-discountAmount))) : 0;
  const afterDiscount = round2(Math.max(0, subtotal - discountAmount - pointsDiscount));
  const tipAmount = round2((isTable || posPaymentMethod==='Crédito') ? 0 : (posTipPercent==='custom' ? (posTipCustom||0) : afterDiscount*((posTipPercent||0)/100)));
  const amountDue = round2(afterDiscount + tipAmount);
  wrap.innerHTML = posTotalsHTML(subtotal, discountAmount, pointsDiscount, tipAmount, afterDiscount, amountDue);
}
function renderPOS(root){
  const cats = [...new Set(state.products.map(p=>p.category))];
  /* Corrección: posCategory arrancaba en 'Pizzas', una categoría que no existe en este
     negocio — eso dejaba la grilla de productos vacía al abrir Venta Rápida por primera
     vez. Si la categoría activa ya no existe, se cae a la primera categoría real. */
  if(!cats.includes(posCategory)) posCategory = cats[0] || '';
  const catEmoji = (name)=> (state.categories.find(c=>c.name===name)||{}).emoji || '🍽️';
  const q = posSearchQuery.trim().toLowerCase();
  const items = q ? state.products.filter(p=>p.name.toLowerCase().includes(q)) : state.products.filter(p=>p.category===posCategory);
  const customer = state.customers.find(c=>c.id===posSelectedCustomerId);
  const selectedTable = state.tables.find(t=>t.id===posSelectedTableId);
  const subtotal = round2(cart.reduce((a,i)=>a+i.price*i.qty,0));
  const unpaidTableSales = state.sales.filter(s=> s.tableId && !s.paid && !s.fiado);
  const cartUnits = cart.reduce((a,i)=>a+i.qty,0);

  /* El panel "Orden actual" ahora solo contiene la lista del carrito — cliente, mesa, pago,
     propina, descuento y puntos se movieron a un modal ("Continuar pedido") para que la
     lista tenga todo el espacio disponible: con pedidos de 20+ productos, antes ese espacio
     quedaba diminuto porque el bloque de cobro (siempre visible) lo empujaba hacia arriba. */
  root.innerHTML = `
    <div class="pos-layout">
      <div class="pos-products flex flex-col min-h-0">
        <input id="posSearch" value="${esc(posSearchQuery)}" placeholder="🔍 Buscar producto por nombre…" class="${inputCls} mb-3">
        <div class="pill-wrap mb-4 ${q?'opacity-40 pointer-events-none':''}">
          ${cats.map(c=>`<button data-cat="${esc(c)}" type="button" class="px-4 py-2 rounded-lg text-sm font-semibold whitespace-nowrap ${posCategory===c?'bg-ember text-white':'surface-2 text-muted'}">${catEmoji(c)} ${esc(c)}</button>`).join('')}
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 overflow-y-auto pr-1">
          ${items.length ? items.map(p=>{
            const outOfStock = p.trackInventory && (p.stock||0) <= 0;
            return `<button data-add="${p.id}" type="button" ${outOfStock?'disabled':''} class="tile surface rounded-xl p-4 text-left ${outOfStock?'opacity-40 pointer-events-none':''}">
              <div class="text-3xl mb-2">${p.emoji}</div>
              <div class="text-sm font-semibold leading-tight">${esc(p.name)}</div>
              <div class="flex items-center justify-between mt-2">
                <div class="font-mono text-xs text-muted">${fmt(p.price)}</div>
                ${outOfStock ? `<span class="text-[10px] font-semibold ember">Agotado</span>` : (p.trackInventory ? `<span class="text-[10px] text-muted">${p.stock} ${esc(p.unit||'')}</span>` : '')}
              </div>
            </button>`;
          }).join('') : `<div class="col-span-full text-sm text-muted p-6 text-center">Sin resultados para "${esc(posSearchQuery)}"</div>`}
        </div>
      </div>

      <div class="pos-order surface rounded-xl p-5 flex flex-col min-h-0 rule-top">
        <div class="flex items-center justify-between mb-3">
          <div class="font-display text-lg flex items-center gap-2">Orden actual ${cart.length?`<span class="badge text-[10px] px-2 py-0.5 rounded-full surface-2 text-muted font-sans">${cartUnits} u.</span>`:''}</div>
          ${cart.length ? `<button id="clearCartBtn" type="button" class="text-[11px] text-muted underline">Vaciar orden</button>` : ''}
        </div>
        <div class="flex-1 overflow-y-auto space-y-2 mb-3 min-h-[80px]">
          ${cart.length ? cart.map((i,idx)=>{
            const noteOpen = posOpenNoteIdx.has(idx) || !!i.note;
            return `
            <div class="surface-2 rounded-lg p-3">
              <div class="flex items-center justify-between gap-2">
                <div class="min-w-0"><div class="text-sm font-medium truncate">${esc(i.name)}</div><div class="text-xs text-muted font-mono flex flex-wrap gap-1"><span>${fmt(i.price)}</span><span>x${i.qty}</span><span>= ${fmt(round2(i.price*i.qty))}</span></div></div>
                <div class="flex items-center gap-1 shrink-0">
                  <button data-dec="${idx}" type="button" class="w-8 h-8 rounded-lg surface border border-line text-base leading-none">−</button>
                  <span class="w-7 text-center text-sm font-semibold">${i.qty}</span>
                  <button data-inc="${idx}" type="button" class="w-8 h-8 rounded-lg surface border border-line text-base leading-none">+</button>
                  <button data-rm="${idx}" type="button" title="Quitar del carrito" class="w-8 h-8 rounded-lg text-red-500 text-base leading-none">✕</button>
                </div>
              </div>
              ${noteOpen ? `
              <div class="mt-2">
                <textarea data-note="${idx}" rows="2" placeholder="Ej. sin tomate, extra salsa, para llevar aparte…" class="w-full rounded-lg px-3 py-2 text-sm leading-tight">${esc(i.note||'')}</textarea>
                <button data-note-close="${idx}" type="button" class="text-[11px] text-muted underline mt-1">${i.note ? '🗑 Quitar comentario' : 'Cancelar'}</button>
              </div>` : `
              <button data-note-open="${idx}" type="button" class="note-add-btn mt-2 w-full py-2 rounded-lg text-[11px] text-muted text-left px-2">🗨️ Agregar comentario para cocina</button>
              `}
            </div>`;
          }).join('') : `<div class="text-sm text-muted text-center py-4">🧾 Toca un producto para agregarlo</div>`}
        </div>

        <div class="border-t border-line pt-3 space-y-2">
          <div class="flex items-center justify-between text-xs text-muted">
            <span>${selectedTable ? '🍽️ '+esc(selectedTable.name) : '🥡 Para llevar'}</span>
            <span>${customer ? '👤 '+esc(customer.name) : 'Sin cliente'}</span>
          </div>
          <div class="flex items-center justify-between text-sm font-mono"><span class="text-muted font-sans text-xs">Subtotal</span><span>${fmt(subtotal)}</span></div>
          <button id="openCheckoutBtn" type="button" ${cart.length?'':'disabled'} class="w-full py-3 rounded-lg bg-ember text-white font-semibold disabled:opacity-40">Continuar pedido →</button>
        </div>
      </div>
    </div>

    ${unpaidTableSales.length ? `
    <div class="surface rounded-xl p-4 mt-5 rule-top">
      <div class="font-display text-lg mb-3">Mesas pendientes de cobro</div>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
        ${unpaidTableSales.map(s=>`
          <div class="surface-2 rounded-lg p-3 flex items-center justify-between gap-2">
            <div class="min-w-0"><div class="text-sm font-semibold">${esc(s.tableName)} · #${s.orderNumber}</div><div class="text-xs text-muted font-mono">${fmt(s.total)}</div></div>
            <button data-quick-charge="${s.id}" class="px-3 py-2 rounded-lg bg-ember text-white text-xs font-semibold shrink-0">Cobrar</button>
          </div>`).join('')}
      </div>
    </div>` : ''}
  `;

  /* Vuelve a dibujar la pantalla sin perder el foco ni la posición del cursor en el campo
     que se estaba editando — necesario para el buscador de productos, donde el usuario
     escribe varias letras seguidas y antes se perdía el foco en cada tecla. */
  function reRenderKeepFocus(id){
    renderPOS(root);
    const el = document.getElementById(id);
    if(!el) return;
    el.focus();
    /* setSelectionRange no está soportado en inputs type="number" (Chrome lanza un error) —
       para esos basta con re-enfocar; el cursor por defecto queda al final. */
    if(el.setSelectionRange && el.type !== 'number'){ el.setSelectionRange(el.value.length, el.value.length); }
  }

  document.querySelectorAll('[data-quick-charge]').forEach(b=>b.addEventListener('click', ()=>{
    const sale = state.sales.find(s=>s.id===b.dataset.quickCharge);
    openPaymentModal(sale, ()=>{
      const t = state.tables.find(x=>x.id===sale.tableId); if(t){ t.status='disponible'; t.currentSaleId=null; saveState(); }
      renderPOS(root);
      openTicketModal(sale);
    });
  }));

  document.getElementById('posSearch').addEventListener('input', (e)=>{
    posSearchQuery = e.target.value; reRenderKeepFocus('posSearch');
  });
  document.querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click', ()=>{ posCategory=b.dataset.cat; renderPOS(root); }));
  document.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click', ()=>{
    const p = state.products.find(x=>x.id===b.dataset.add);
    const existing = cart.find(i=>i.id===p.id && !i.note);
    const qtyInCart = existing ? existing.qty+1 : 1;
    if(p.trackInventory && qtyInCart > p.stock) showToast(`⚠️ Ya no tienes stock de ${p.name}`, 'danger');
    if(existing) existing.qty++; else cart.push({ id:p.id, name:p.name, price:p.price, cost:p.costPrice||0, qty:1, note:'' });
    renderPOS(root);
  }));
  document.getElementById('clearCartBtn')?.addEventListener('click', ()=>{
    cart = []; posOpenNoteIdx = new Set(); renderPOS(root);
  });
  document.querySelectorAll('[data-inc]').forEach(b=>b.addEventListener('click', ()=>{ cart[b.dataset.inc].qty++; renderPOS(root); }));
  document.querySelectorAll('[data-dec]').forEach(b=>b.addEventListener('click', ()=>{ const i=b.dataset.dec; cart[i].qty--; if(cart[i].qty<=0) cart.splice(i,1); renderPOS(root); }));
  document.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click', ()=>{ cart.splice(b.dataset.rm,1); renderPOS(root); }));
  document.querySelectorAll('[data-note]').forEach(inp=>inp.addEventListener('input', ()=>{ cart[inp.dataset.note].note = inp.value; }));
  document.querySelectorAll('[data-note-open]').forEach(b=>b.addEventListener('click', ()=>{
    const idx = b.dataset.noteOpen; posOpenNoteIdx.add(Number(idx));
    renderPOS(root);
    const ta = document.querySelector(`[data-note="${idx}"]`);
    if(ta){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  }));
  document.querySelectorAll('[data-note-close]').forEach(b=>b.addEventListener('click', ()=>{
    const idx = Number(b.dataset.noteClose); cart[idx].note = ''; posOpenNoteIdx.delete(idx);
    renderPOS(root);
  }));

  document.getElementById('openCheckoutBtn')?.addEventListener('click', ()=> openCheckoutModal(root));
}

/* =========================================================================
   CONTINUAR PEDIDO — modal de cobro/envío a cocina (cliente, mesa, método de
   pago, propina, descuento/puntos). Se separó del panel "Orden actual" para
   que la lista del carrito tenga todo el alto disponible en pedidos grandes.
   ========================================================================= */
function openCheckoutModal(root){
  const customer = state.customers.find(c=>c.id===posSelectedCustomerId);
  const selectedTable = state.tables.find(t=>t.id===posSelectedTableId);
  const isTable = !!selectedTable;
  const subtotal = round2(cart.reduce((a,i)=>a+i.price*i.qty,0));
  /* Las órdenes de mesa NO deciden descuento/canje de puntos aquí — se envían a cocina tal
     cual y el descuento se aplica al cobrar la cuenta real (openPaymentModal). Así el
     descuento nunca queda "atrapado" en un pedido que aún no se sabe si se va a cobrar así. */
  const discountAmount = isTable ? 0 : round2(Math.min(subtotal, posDiscountType==='percent' ? subtotal*((posDiscountValue||0)/100) : (posDiscountValue||0)));
  const pointsDiscount = (!isTable && customer && !customer.loyaltyExempt && state.settings.loyaltyEnabled) ? round2(Math.min((Math.min(posRedeemPoints||0, customer.points||0))*(state.settings.loyaltyPointValue||0), Math.max(0,subtotal-discountAmount))) : 0;
  const afterDiscount = round2(Math.max(0, subtotal - discountAmount - pointsDiscount));
  const tipAmount = round2((isTable || posPaymentMethod==='Crédito') ? 0 : (posTipPercent==='custom' ? (posTipCustom||0) : afterDiscount*((posTipPercent||0)/100)));
  const amountDue = round2(afterDiscount + tipAmount);

  const body = `
    <div class="space-y-3">
      <div class="flex gap-2">
        <input id="custInput" list="custList" value="${customer?esc(customer.name):''}" placeholder="Escribe o busca el cliente (opcional)" class="${inputCls} flex-1">
        <button id="custClear" type="button" class="px-3 rounded-lg surface-2 text-xs text-muted">✕</button>
      </div>
      <datalist id="custList">${state.customers.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist>
      ${customer ? `<div class="text-xs text-muted flex items-center justify-between"><span>WhatsApp: <span class="font-mono">${esc(customer.whatsapp||'—')}</span></span>${state.settings.loyaltyEnabled?(customer.loyaltyExempt?`<span class="text-muted">Sin acumulación de puntos</span>`:`<span class="gold">★ ${customer.points||0} pts</span>`):''}</div>` : `<button id="custNewBtn" type="button" class="text-xs ember font-semibold">+ Registrar como nuevo cliente</button>`}

      <div>
        <div class="text-[11px] text-muted uppercase tracking-wide mb-1.5">Mesa</div>
        <button id="mesaPickerBtn" type="button" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg surface-2 text-sm font-semibold text-left">
          <span>${selectedTable ? '🍽️ '+esc(selectedTable.name) : '🥡 Para llevar'}</span><span class="text-muted text-xs">Cambiar ▾</span>
        </button>
      </div>

      ${isTable ? `
      <div class="surface-2 rounded-lg p-3 text-xs text-muted">Pedido para mesa: se envía a cocina sin cobrar. Podrás cobrar (con propina, descuento y puntos) cuando el cliente pida la cuenta, desde <strong>Mesas</strong> o <strong>Historial</strong>.</div>
      ` : `
      <div>
        <div class="text-[11px] text-muted uppercase tracking-wide mb-1.5">Método de pago</div>
        <div class="pm-grid">
          ${PAYMENT_METHODS.map(m=>`<button type="button" data-pm="${m.id}" class="py-2 rounded-lg text-[10px] font-semibold leading-tight text-center ${posPaymentMethod===m.id?'bg-ember text-white':'surface-2 text-muted'}"><div class="text-sm">${m.icon}</div>${esc(m.label)}</button>`).join('')}
        </div>
      </div>
      ${posPaymentMethod!=='Crédito' ? `
      <div>
        <div class="text-[11px] text-muted uppercase tracking-wide mb-1.5">Propina</div>
        <div class="flex gap-2">
          ${[0,10,15,20].map(p=>`<button type="button" data-tip="${p}" class="flex-1 py-2 rounded-lg text-xs font-semibold ${posTipPercent===p?'bg-ember text-white':'surface-2'}">${p===0?'Sin':p+'%'}</button>`).join('')}
          <button type="button" data-tip="custom" class="flex-1 py-2 rounded-lg text-xs font-semibold ${posTipPercent==='custom'?'bg-ember text-white':'surface-2'}">Otro</button>
        </div>
        ${posTipPercent==='custom' ? `<input id="tipCustomInput" type="number" step="0.01" min="0" value="${posTipCustom||''}" placeholder="Monto de propina $" class="${inputCls} mt-2">` : ''}
      </div>
      ` : ''}
      <div id="payExtra"></div>

      <button id="toggleExtrasBtn" type="button" class="text-xs text-muted underline w-full text-left">${posShowExtras?'▲ Ocultar':'▼'} Descuento, puntos y canal de venta</button>
      ${posShowExtras ? `
      <div class="surface-2 rounded-lg p-3 space-y-2">
        <div class="grid grid-cols-2 gap-2">
          <div class="flex rounded-lg overflow-hidden border border-line text-xs font-semibold">
            <button type="button" data-disctype="percent" class="flex-1 py-2 ${posDiscountType==='percent'?'bg-ember text-white':'surface-2 text-muted'}">Descuento %</button>
            <button type="button" data-disctype="fixed" class="flex-1 py-2 ${posDiscountType==='fixed'?'bg-ember text-white':'surface-2 text-muted'}">Descuento $</button>
          </div>
          <input id="discValue" type="number" step="0.01" min="0" value="${posDiscountValue||''}" placeholder="0" class="${inputCls}">
        </div>
        ${customer && !customer.loyaltyExempt && state.settings.loyaltyEnabled && (customer.points||0) > 0 ? `
        <div class="flex gap-2 items-center">
          <input id="redeemPoints" type="number" min="0" max="${customer.points||0}" step="1" value="${posRedeemPoints||''}" placeholder="Canjear puntos" class="${inputCls} flex-1">
          <span class="text-xs text-muted whitespace-nowrap">de ${customer.points||0} pts</span>
        </div>` : ''}
        <select id="channelSelect" class="${inputCls}">
          ${state.settings.deliveryChannels.map(ch=>`<option value="${ch.id}" ${posChannel===ch.id?'selected':''}>${esc(ch.name)}${ch.commissionPct?` · comisión ${ch.commissionPct}%`:''}</option>`).join('')}
        </select>
      </div>
      ` : ''}
      `}

      <div id="posTotalsWrap">${posTotalsHTML(subtotal, discountAmount, pointsDiscount, tipAmount, afterDiscount, amountDue)}</div>
      <button id="checkoutBtn" class="w-full py-3 rounded-lg bg-ember text-white font-semibold">${isTable ? 'Enviar orden a cocina' : 'Cobrar y generar orden'}</button>
    </div>
  `;
  const ov = updateModalInPlace('Continuar pedido', body, { wide:true });

  const custInput = ov.querySelector('#custInput');
  custInput.addEventListener('change', (e)=>{
    const match = state.customers.find(c=>c.name.toLowerCase()===e.target.value.trim().toLowerCase());
    posSelectedCustomerId = match ? match.id : '';
    /* setTimeout(0): el evento "change" de un input con datalist puede llegar mientras el
       navegador todavía está cerrando su propio menú de sugerencias — reconstruir el modal
       (y por lo tanto quitar el input) en ese mismo instante puede generar un error interno
       inofensivo en algunos navegadores. Dejar que termine ese ciclo primero evita eso. */
    setTimeout(()=> openCheckoutModal(root), 0);
  });
  ov.querySelector('#custClear').addEventListener('click', ()=>{ posSelectedCustomerId=''; openCheckoutModal(root); });
  ov.querySelector('#custNewBtn')?.addEventListener('click', ()=> openNewCustomerModal(()=> openCheckoutModal(root)));
  ov.querySelector('#mesaPickerBtn').addEventListener('click', ()=> openTablePickerModal((tableId)=>{ posSelectedTableId = tableId; openCheckoutModal(root); }));
  ov.querySelector('#toggleExtrasBtn')?.addEventListener('click', ()=>{ posShowExtras = !posShowExtras; openCheckoutModal(root); });
  ov.querySelectorAll('[data-disctype]').forEach(b=>b.addEventListener('click', ()=>{ posDiscountType = b.dataset.disctype; openCheckoutModal(root); }));
  ov.querySelector('#discValue')?.addEventListener('input', (e)=>{ posDiscountValue = parseFloat(e.target.value)||0; recomputePosTotals(); });
  ov.querySelector('#redeemPoints')?.addEventListener('input', (e)=>{ posRedeemPoints = parseFloat(e.target.value)||0; recomputePosTotals(); });
  ov.querySelector('#channelSelect')?.addEventListener('change', (e)=>{ posChannel = e.target.value; });
  ov.querySelectorAll('[data-tip]').forEach(b=>b.addEventListener('click', ()=>{ posTipPercent = b.dataset.tip==='custom'?'custom':parseInt(b.dataset.tip); openCheckoutModal(root); }));
  ov.querySelector('#tipCustomInput')?.addEventListener('input', (e)=>{ posTipCustom = parseFloat(e.target.value)||0; recomputePosTotals(); });
  ov.querySelectorAll('[data-pm]').forEach(b=>b.addEventListener('click', ()=>{ posPaymentMethod = b.dataset.pm; openCheckoutModal(root); }));

  function renderPayExtra(){
    if(isTable) return;
    const extra = ov.querySelector('#payExtra');
    if(!extra) return;
    const total = amountDue;
    if(posPaymentMethod === 'Efectivo'){
      extra.innerHTML = `<input id="cashGiven" type="number" step="0.01" placeholder="Monto recibido en efectivo" class="${inputCls}"><div class="text-xs text-muted mt-1" id="changeDue">Vuelto: ${fmt(0)}</div>`;
      extra.querySelector('#cashGiven').addEventListener('input', (e)=>{ const given = parseFloat(e.target.value)||0; extra.querySelector('#changeDue').textContent = 'Vuelto: ' + fmt(Math.max(0, given-total)); });
    } else if(posPaymentMethod === 'Mixto'){
      extra.innerHTML = `
        <div class="grid grid-cols-2 gap-2">
          <input id="mixCash" type="number" step="0.01" placeholder="Efectivo aplicado $" class="${inputCls}">
          <input id="mixCashReceived" type="number" step="0.01" placeholder="Efectivo recibido $" class="${inputCls}">
          <input id="mixCard" type="number" step="0.01" placeholder="Tarjeta $" class="${inputCls}">
          <input id="mixTransfer" type="number" step="0.01" placeholder="Transferencia $" class="${inputCls}">
        </div>
        <div class="text-xs mt-1" id="mixRemaining">Falta cubrir: ${fmt(total)}</div>
        <div class="text-xs text-muted" id="mixChange">Vuelto en efectivo: ${fmt(0)}</div>`;
      ['mixCash','mixCashReceived','mixCard','mixTransfer'].forEach(id=>{
        extra.querySelector('#'+id).addEventListener('input', ()=>{
          const c = parseFloat(extra.querySelector('#mixCash').value)||0;
          const cr = parseFloat(extra.querySelector('#mixCashReceived').value)||0;
          const cd = parseFloat(extra.querySelector('#mixCard').value)||0;
          const tr = parseFloat(extra.querySelector('#mixTransfer').value)||0;
          const rem = total - (c+cd+tr);
          const el = extra.querySelector('#mixRemaining');
          el.textContent = rem > 0.001 ? `Falta cubrir: ${fmt(rem)}` : (rem < -0.001 ? `Sobrante: ${fmt(-rem)}` : 'Cubierto ✔');
          el.style.color = Math.abs(rem)<0.001 ? 'var(--basil)' : 'var(--red)';
          extra.querySelector('#mixChange').textContent = 'Vuelto en efectivo: ' + fmt(Math.max(0, cr-c));
        });
      });
    } else if(['Zelle','Venmo','CashApp','Apple Pay'].includes(posPaymentMethod)){
      extra.innerHTML = `<select id="bankSelect" class="${inputCls}"><option value="">Banco/plataforma (opcional)</option>${state.banks.map(b=>`<option>${esc(b.name)}</option>`).join('')}</select>`;
    } else if(posPaymentMethod === 'Crédito'){
      extra.innerHTML = posSelectedCustomerId
        ? `<div class="text-xs" style="color:var(--red)">Esta orden quedará en <strong>Por cobrar</strong> a nombre de ${esc(state.customers.find(c=>c.id===posSelectedCustomerId)?.name||'')}.</div>`
        : `<div class="text-xs" style="color:var(--danger)">Selecciona primero un cliente arriba para dejar la cuenta a crédito.</div>`;
    } else { extra.innerHTML = ''; }
  }
  renderPayExtra();

  ov.querySelector('#checkoutBtn').addEventListener('click', ()=>{
    if(!guardStaleShift()) return;
    const table = selectedTable;
    let payment = null, paid = false, method = null, fiado = false;

    if(!table){
      method = posPaymentMethod;
      if(method==='Crédito'){
        const chk = creditCheck(customer, afterDiscount);
        if(!chk.ok){ showToast(chk.msg, 'danger'); return; }
        fiado = true; paid = false; payment = null;
      } else {
        payment = { method, bank:null, cashGiven:null, change:null, breakdown:null };
        if(method==='Efectivo'){
          const given = parseFloat(ov.querySelector('#cashGiven')?.value)||0;
          if(given < amountDue){ showToast('El monto recibido es menor al total', 'danger'); return; }
          payment.cashGiven = given; payment.change = round2(given-amountDue);
        } else if(method==='Mixto'){
          const c = parseFloat(ov.querySelector('#mixCash')?.value)||0;
          const cr = parseFloat(ov.querySelector('#mixCashReceived')?.value)||0;
          const cd = parseFloat(ov.querySelector('#mixCard')?.value)||0;
          const tr = parseFloat(ov.querySelector('#mixTransfer')?.value)||0;
          if(Math.abs(round2(c+cd+tr)-amountDue) > 0.01){ showToast('El pago mixto no cubre el total exacto', 'danger'); return; }
          payment.breakdown = { efectivo:c, efectivoRecibido:cr, tarjeta:cd, transferencia:tr };
          payment.change = round2(Math.max(0, cr-c));
        } else { payment.bank = ov.querySelector('#bankSelect')?.value || null; }
        paid = true;
      }
    }

    const discountPct = subtotal>0 ? (discountAmount/subtotal*100) : 0;
    const finalizeSale = (authorizedBy)=>{
      const shift = openShiftFor(state.settings.currentUserId);
      const channel = !table ? state.settings.deliveryChannels.find(c=>c.id===posChannel) : null;
      const commissionAmount = channel ? round2(afterDiscount * (channel.commissionPct||0) / 100) : 0;
      const finalTip = (table || method==='Crédito') ? 0 : tipAmount;
      const sale = {
        id: uid('sale'), orderNumber: ORDER_COUNTER++, date: todayStr(),
        time: new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}),
        items: cart.map(i=>({...i})), subtotal, total: afterDiscount, tip: finalTip,
        discount: discountAmount>0 ? { type:posDiscountType, value:posDiscountValue, amount:discountAmount, authorizedBy: discountPct>(state.settings.discountAuthThreshold||10) ? authorizedBy : null } : null,
        pointsRedeemed: pointsDiscount>0 ? (posRedeemPoints||0) : 0, pointsRedeemedValue: pointsDiscount, pointsEarned: 0,
        payment, paymentMethod: fiado?'Crédito':method, paid, fiado,
        customerId: customer?.id || null, customerName: customer?.name || null, customerWhatsapp: customer?.whatsapp || null,
        tableId: table?.id || null, tableName: table?.name || null, status: 'pendiente', shiftId: shift?.id || null,
        channelId: channel?.id || null, channelName: channel?.name || null, commissionPct: channel?.commissionPct||0, commissionAmount
      };
      state.sales.push(sale);
      if(table){ table.status='ocupada'; table.currentSaleId = sale.id; }
      sale.items.forEach(i=> adjustStock(i.id, -i.qty, 'venta', `Orden #${sale.orderNumber}`));
      const outOfStock = sale.items.filter(i=>{ const p = state.products.find(x=>x.id===i.id); return p && p.trackInventory && p.stock < 0; }).map(i=>i.name);
      if(outOfStock.length) showToast(`⚠️ Ya no tienes stock de: ${outOfStock.join(', ')}`, 'danger');
      if(customer && pointsDiscount>0){ const usedPts = Math.min(posRedeemPoints||0, customer.points||0); customer.points = Math.max(0, round2((customer.points||0) - usedPts)); }
      /* Puntos acumulados: solo si hay un cliente real de la base de datos seleccionado y ese
         cliente no está marcado como "no acumula puntos" (cliente genérico). Se guarda en la
         propia venta (sale.pointsEarned) para poder mostrarlo en el recibo impreso y en pantalla. */
      if(customer && !customer.loyaltyExempt && paid && state.settings.loyaltyEnabled){
        const earned = Math.floor(sale.total * (state.settings.loyaltyPerDollar||0));
        customer.points = round2((customer.points||0) + earned);
        sale.pointsEarned = earned;
      }
      logAudit('venta_creada', `Orden #${sale.orderNumber} · ${fmt(sale.total)}${table?' · '+table.name:''}${fiado?' · A CRÉDITO':''}${sale.discount?' · Desc. '+fmt(discountAmount):''}${sale.tip?' · Propina '+fmt(sale.tip):''}`);
      saveState();
      /* posSelectedCustomerId también se limpia aquí: si no, el siguiente pedido arrancaba
         con el cliente de la venta anterior ya seleccionado por error. */
      cart = []; posSelectedTableId = ''; posSelectedCustomerId = ''; resetCheckoutExtras();
      showToast(table ? `Orden #${sale.orderNumber} enviada a cocina` : `Orden #${sale.orderNumber} registrada`);
      openTicketModal(sale);
      renderPOS(root);
    };

    if(discountAmount>0 && discountPct > (state.settings.discountAuthThreshold||10)){
      openAdminPinModal(`Este descuento de ${discountPct.toFixed(0)}% supera el ${state.settings.discountAuthThreshold}% permitido y necesita autorización de un administrador.`, (adminName)=> finalizeSale(adminName));
    } else {
      finalizeSale(null);
    }
  });
}

/* Selector de mesas con búsqueda: reemplaza la lista de mesas en línea (que con 100 mesas
   reales se volvía inmanejable) por un botón + modal con buscador, para elegir mesa en
   dos toques sin importar cuántas mesas tenga el negocio. */
function openTablePickerModal(onPick){
  let query = '';
  const body = `
    <input id="tblSearch" placeholder="🔍 Buscar mesa por nombre o número…" class="${inputCls} mb-3">
    <div id="tblResults" class="pill-wrap"></div>
  `;
  const ov = updateModalInPlace('Elegir mesa', body);
  function renderResults(){
    const qq = query.trim().toLowerCase();
    const list = state.tables.filter(t=> t.status==='disponible' || t.id===posSelectedTableId).filter(t=> !qq || t.name.toLowerCase().includes(qq));
    ov.querySelector('#tblResults').innerHTML = `
      ${!qq ? `<button type="button" data-pick-table="" class="px-3 py-2 rounded-lg text-xs font-semibold whitespace-nowrap ${!posSelectedTableId?'bg-ember text-white':'surface-2 text-muted'}">🥡 Para llevar</button>` : ''}
      ${list.map(t=>`<button type="button" data-pick-table="${t.id}" class="px-3 py-2 rounded-lg text-xs font-semibold whitespace-nowrap ${posSelectedTableId===t.id?'bg-ember text-white':'surface-2 text-muted'}">🍽️ ${esc(t.name)}</button>`).join('')}
      ${!list.length && qq ? `<div class="text-xs text-muted p-3">Sin mesas disponibles que coincidan con "${esc(query)}"</div>` : ''}
    `;
    ov.querySelectorAll('[data-pick-table]').forEach(b=>b.addEventListener('click', ()=> onPick(b.dataset.pickTable)));
  }
  ov.querySelector('#tblSearch').addEventListener('input', (e)=>{ query = e.target.value; renderResults(); });
  renderResults();
  ov.querySelector('#tblSearch').focus();
}

/* =========================================================================
   COBRO POSTERIOR — para órdenes de mesa que se pagan al final
   ========================================================================= */
function openPaymentModal(sale, onDone){
  if(!guardStaleShift()) return;
  /* Este es el momento real de cobro para órdenes de mesa — por eso el descuento y el canje
     de puntos viven aquí (y no en el envío a cocina): recién ahora se sabe el consumo final
     y si el cliente califica para un descuento. sale.total es el subtotal de la orden (las
     mesas se crean sin descuento aplicado). */
  const customer = state.customers.find(c=>c.id===sale.customerId);
  const baseTotal = sale.total;
  let pmTipPercent = 0, pmTipCustom = 0;
  let pmDiscType = 'percent', pmDiscValue = 0, pmRedeemPoints = 0, pmShowExtras = false;

  function calc(){
    const discAmt = pmDiscType==='percent' ? round2(baseTotal*((pmDiscValue||0)/100)) : round2(pmDiscValue||0);
    const discountAmount = round2(Math.min(baseTotal, discAmt));
    const pointsDiscount = (customer && !customer.loyaltyExempt && state.settings.loyaltyEnabled) ? round2(Math.min((Math.min(pmRedeemPoints||0, customer.points||0))*(state.settings.loyaltyPointValue||0), Math.max(0, baseTotal-discountAmount))) : 0;
    const afterDiscount = round2(Math.max(0, baseTotal - discountAmount - pointsDiscount));
    const tip = round2(pmTipPercent==='custom' ? (pmTipCustom||0) : afterDiscount*((pmTipPercent||0)/100));
    const total = round2(afterDiscount + tip);
    return { discountAmount, pointsDiscount, afterDiscount, tip, total };
  }

  const canRedeem = customer && !customer.loyaltyExempt && state.settings.loyaltyEnabled && (customer.points||0) > 0;
  const body = `
    <div class="text-sm mb-3">Orden #${sale.orderNumber}${sale.tableName?' · '+esc(sale.tableName):''} — Cuenta <span class="font-mono font-semibold">${fmt(baseTotal)}</span></div>

    <button id="pmToggleExtras" type="button" class="text-xs text-muted underline w-full text-left mb-2">▼ Descuento${canRedeem?' y puntos':''}</button>
    <div id="pmExtrasWrap" class="mb-3"></div>

    <div class="text-[11px] text-muted uppercase tracking-wide mb-1">Propina</div>
    <div class="flex gap-1.5 mb-2" id="pmTipButtons">
      ${[0,10,15,20].map(p=>`<button type="button" data-pmtip="${p}" class="flex-1 py-2 rounded-lg text-xs font-semibold ${p===0?'bg-ember text-white':'surface-2'}">${p===0?'Sin':p+'%'}</button>`).join('')}
      <button type="button" data-pmtip="custom" class="flex-1 py-2 rounded-lg text-xs font-semibold surface-2">Otro</button>
    </div>
    <div id="pmTipCustomWrap"></div>
    <div id="pmDue" class="text-xs text-muted mb-3"></div>
    <select id="pmMethod" class="${inputCls} mb-3">
      <option value="Efectivo">Efectivo</option><option value="Tarjeta">Tarjeta de crédito/débito</option>
      <option value="Zelle">Zelle</option><option value="Venmo">Venmo</option><option value="CashApp">Cash App</option>
      <option value="Apple Pay">Apple Pay</option><option value="Mixto">Pago mixto</option>
    </select>
    <div id="pmExtra"></div>
    <button id="pmConfirm" class="w-full py-2.5 rounded-lg bg-ember text-white text-sm font-semibold mt-3">Confirmar cobro</button>
    ${sale.customerId ? `<button id="pmFiar" class="w-full py-2.5 rounded-lg surface-2 text-xs font-semibold mt-2 text-muted">Dejar a crédito (cobrar después a ${esc(sale.customerName)})</button>` : `<div class="text-[11px] text-muted text-center mt-2">Para dejar la cuenta a crédito, la orden necesita tener un cliente asignado.</div>`}
  `;
  const ov = openModal('Cobrar orden', body);
  const methodSel = ov.querySelector('#pmMethod');

  function renderExtrasWrap(){
    const wrap = ov.querySelector('#pmExtrasWrap');
    if(!pmShowExtras){ wrap.innerHTML = ''; return; }
    wrap.innerHTML = `
      <div class="surface-2 rounded-lg p-3 space-y-2">
        <div class="grid grid-cols-2 gap-2">
          <div class="flex rounded-lg overflow-hidden border border-line text-xs font-semibold">
            <button type="button" data-pmdisctype="percent" class="flex-1 py-2 ${pmDiscType==='percent'?'bg-ember text-white':'surface-2 text-muted'}">Descuento %</button>
            <button type="button" data-pmdisctype="fixed" class="flex-1 py-2 ${pmDiscType==='fixed'?'bg-ember text-white':'surface-2 text-muted'}">Descuento $</button>
          </div>
          <input id="pmDiscValue" type="number" step="0.01" min="0" value="${pmDiscValue||''}" placeholder="0" class="${inputCls}">
        </div>
        ${canRedeem ? `
        <div class="flex gap-2 items-center">
          <input id="pmRedeemPoints" type="number" min="0" max="${customer.points||0}" step="1" value="${pmRedeemPoints||''}" placeholder="Canjear puntos" class="${inputCls} flex-1">
          <span class="text-xs text-muted whitespace-nowrap">de ${customer.points||0} pts</span>
        </div>` : ''}
      </div>
    `;
    wrap.querySelectorAll('[data-pmdisctype]').forEach(b=>b.addEventListener('click', ()=>{ pmDiscType = b.dataset.pmdisctype; renderExtrasWrap(); updateDue(); renderExtra(); }));
    wrap.querySelector('#pmDiscValue')?.addEventListener('input', (e)=>{ pmDiscValue = parseFloat(e.target.value)||0; updateDue(); renderExtra(); });
    wrap.querySelector('#pmRedeemPoints')?.addEventListener('input', (e)=>{ pmRedeemPoints = parseFloat(e.target.value)||0; updateDue(); renderExtra(); });
  }
  ov.querySelector('#pmToggleExtras').addEventListener('click', ()=>{
    pmShowExtras = !pmShowExtras;
    ov.querySelector('#pmToggleExtras').textContent = `${pmShowExtras?'▲ Ocultar':'▼'} Descuento${canRedeem?' y puntos':''}`;
    renderExtrasWrap();
  });
  renderExtrasWrap();

  function updateDue(){
    const { discountAmount, pointsDiscount, tip, total } = calc();
    const parts = [];
    if(discountAmount>0) parts.push(`Descuento -${fmt(discountAmount)}`);
    if(pointsDiscount>0) parts.push(`Puntos canjeados -${fmt(pointsDiscount)}`);
    if(tip>0) parts.push(`Propina +${fmt(tip)}`);
    ov.querySelector('#pmDue').textContent = (parts.length ? parts.join(' · ')+' · ' : '') + `Total a cobrar: ${fmt(total)}`;
  }
  ov.querySelectorAll('[data-pmtip]').forEach(b=>b.addEventListener('click', ()=>{
    pmTipPercent = b.dataset.pmtip==='custom' ? 'custom' : parseInt(b.dataset.pmtip);
    ov.querySelectorAll('[data-pmtip]').forEach(x=>{ x.classList.remove('bg-ember','text-white'); x.classList.add('surface-2'); });
    b.classList.add('bg-ember','text-white'); b.classList.remove('surface-2');
    ov.querySelector('#pmTipCustomWrap').innerHTML = pmTipPercent==='custom' ? `<input id="pmTipCustomInput" type="number" step="0.01" min="0" placeholder="Monto de propina $" class="${inputCls} mb-3">` : '';
    ov.querySelector('#pmTipCustomInput')?.addEventListener('input', (e)=>{ pmTipCustom = parseFloat(e.target.value)||0; updateDue(); renderExtra(); });
    updateDue(); renderExtra();
  }));
  function renderExtra(){
    const extra = ov.querySelector('#pmExtra'); const { total } = calc();
    if(methodSel.value==='Efectivo'){
      extra.innerHTML = `<input id="pmCash" type="number" step="0.01" placeholder="Monto recibido en efectivo" class="${inputCls}"><div class="text-xs text-muted mt-1" id="pmChange">Vuelto: ${fmt(0)}</div>`;
      extra.querySelector('#pmCash').addEventListener('input', (e)=>{ const g = parseFloat(e.target.value)||0; extra.querySelector('#pmChange').textContent = 'Vuelto: '+fmt(Math.max(0,round2(g-total))); });
    } else if(methodSel.value==='Mixto'){
      extra.innerHTML = `
        <div class="grid grid-cols-2 gap-2">
          <input id="pmMixCash" type="number" step="0.01" placeholder="Efectivo aplicado $" class="${inputCls}">
          <input id="pmMixCashReceived" type="number" step="0.01" placeholder="Efectivo recibido $" class="${inputCls}">
          <input id="pmMixCard" type="number" step="0.01" placeholder="Tarjeta $" class="${inputCls}">
          <input id="pmMixTransfer" type="number" step="0.01" placeholder="Transferencia $" class="${inputCls}">
        </div>
        <div class="text-xs mt-1" id="pmMixRemaining">Falta cubrir: ${fmt(total)}</div>`;
      ['pmMixCash','pmMixCashReceived','pmMixCard','pmMixTransfer'].forEach(id=>{
        extra.querySelector('#'+id).addEventListener('input', ()=>{
          const c=parseFloat(extra.querySelector('#pmMixCash').value)||0, cd=parseFloat(extra.querySelector('#pmMixCard').value)||0, tr=parseFloat(extra.querySelector('#pmMixTransfer').value)||0;
          const rem = round2(total-(c+cd+tr)); const el = extra.querySelector('#pmMixRemaining');
          el.textContent = rem>0.001?`Falta cubrir: ${fmt(rem)}`:(rem<-0.001?`Sobrante: ${fmt(-rem)}`:'Cubierto ✔');
          el.style.color = Math.abs(rem)<0.001 ? 'var(--basil)' : 'var(--red)';
        });
      });
    } else if(['Zelle','Venmo','CashApp','Apple Pay'].includes(methodSel.value)){
      extra.innerHTML = `<select id="pmBank" class="${inputCls}"><option value="">Banco/plataforma (opcional)</option>${state.banks.map(b=>`<option>${esc(b.name)}</option>`).join('')}</select>`;
    } else { extra.innerHTML = ''; }
  }
  methodSel.addEventListener('change', renderExtra); renderExtra(); updateDue();
  ov.querySelector('#pmConfirm').addEventListener('click', ()=>{
    const { discountAmount, pointsDiscount, afterDiscount, tip, total } = calc();
    const method = methodSel.value;
    const discountPct = baseTotal>0 ? (discountAmount/baseTotal*100) : 0;
    let payment = { method, bank:null, cashGiven:null, change:null, breakdown:null };
    if(method==='Efectivo'){
      const given = parseFloat(ov.querySelector('#pmCash')?.value)||0;
      if(given < total){ showToast('El monto recibido es menor al total', 'danger'); return; }
      payment.cashGiven = given; payment.change = round2(given-total);
    } else if(method==='Mixto'){
      const c=parseFloat(ov.querySelector('#pmMixCash')?.value)||0, cr=parseFloat(ov.querySelector('#pmMixCashReceived')?.value)||0, cd=parseFloat(ov.querySelector('#pmMixCard')?.value)||0, tr=parseFloat(ov.querySelector('#pmMixTransfer')?.value)||0;
      if(Math.abs(round2(c+cd+tr)-total) > 0.01){ showToast('El pago mixto no cubre el total exacto', 'danger'); return; }
      payment.breakdown = { efectivo:c, efectivoRecibido:cr, tarjeta:cd, transferencia:tr }; payment.change = round2(Math.max(0,cr-c));
    } else { payment.bank = ov.querySelector('#pmBank')?.value || null; }

    const confirmCharge = (authorizedBy)=>{
      sale.subtotal = baseTotal;
      sale.discount = discountAmount>0 ? { type:pmDiscType, value:pmDiscValue, amount:discountAmount, authorizedBy: discountPct>(state.settings.discountAuthThreshold||10) ? authorizedBy : null } : null;
      sale.pointsRedeemed = pointsDiscount>0 ? (pmRedeemPoints||0) : 0;
      sale.pointsRedeemedValue = pointsDiscount;
      sale.total = afterDiscount;
      sale.payment = payment; sale.paymentMethod = method; sale.paid = true; sale.status = 'entregada'; sale.tip = tip;
      if(customer && pointsDiscount>0){ const usedPts = Math.min(pmRedeemPoints||0, customer.points||0); customer.points = Math.max(0, round2((customer.points||0) - usedPts)); }
      /* Puntos acumulados: solo si hay un cliente real seleccionado (no genérico/sin puntos). */
      if(customer && !customer.loyaltyExempt && state.settings.loyaltyEnabled){
        const earned = Math.floor(sale.total * (state.settings.loyaltyPerDollar||0));
        customer.points = round2((customer.points||0) + earned);
        sale.pointsEarned = earned;
      }
      logAudit('venta_cobrada', `Orden #${sale.orderNumber} · ${fmt(sale.total)} · ${method}${tip?' · Propina '+fmt(tip):''}${sale.discount?' · Desc. '+fmt(discountAmount):''}`);
      saveState(); closeModal(); showToast('Cobro registrado', 'basil');
      onDone && onDone();
    };
    if(discountAmount>0 && discountPct > (state.settings.discountAuthThreshold||10)){
      openAdminPinModal(`Este descuento de ${discountPct.toFixed(0)}% supera el ${state.settings.discountAuthThreshold}% permitido y necesita autorización de un administrador.`, (adminName)=> confirmCharge(adminName));
    } else {
      confirmCharge(null);
    }
  });
  ov.querySelector('#pmFiar')?.addEventListener('click', ()=>{
    const chk = creditCheck(customer, baseTotal);
    if(!chk.ok){ showToast(chk.msg, 'danger'); return; }
    sale.paid = false; sale.fiado = true; sale.payment = null; sale.paymentMethod = 'Crédito'; sale.status = 'entregada';
    logAudit('venta_fiada', `Orden #${sale.orderNumber} · ${fmt(sale.total)} · a ${sale.customerName}`);
    saveState(); closeModal(); showToast('Quedó a crédito con '+sale.customerName, 'ember');
    onDone && onDone();
  });
}

function openNewCustomerModal(onSaved){
  /* WhatsApp ya no es obligatorio: permite registrar rápido un "cliente genérico" (sin datos
     reales) cuando no se tiene la información del cliente a mano — marcándolo además como
     "no acumula puntos" para que no se le sumen puntos de fidelidad por error. */
  const body = `${field('Nombre', `<input id="ncName" class="${inputCls}" placeholder="Ej. Cliente general">`)}${field('WhatsApp (opcional)', `<input id="ncWa" class="${inputCls}" placeholder="+1 305 555 0100">`)}${field('Correo (opcional)', `<input id="ncEmail" class="${inputCls}">`)}${field('Límite de crédito para fiados (USD, 0 = sin límite)', `<input id="ncCredit" type="number" step="0.01" min="0" value="0" class="${inputCls}">`)}
    <label class="flex items-center gap-2 text-xs text-muted mb-3"><input id="ncLoyaltyExempt" type="checkbox" class="w-4 h-4"> No acumula puntos (cliente genérico / sin datos reales)</label>
    <button id="ncSave" class="w-full py-2.5 rounded-lg bg-ember text-white text-sm font-semibold mt-2">Guardar cliente</button>`;
  const overlay = updateModalInPlace('Nuevo cliente', body);
  overlay.querySelector('#ncSave').addEventListener('click', ()=>{
    const name = document.getElementById('ncName').value.trim(); const whatsapp = document.getElementById('ncWa').value.trim();
    if(!name){ showToast('El nombre es obligatorio', 'danger'); return; }
    const c = { id: uid('cust'), name, whatsapp, email: document.getElementById('ncEmail').value.trim(), notes:'', creditLimit: parseFloat(document.getElementById('ncCredit').value)||0, points:0, loyaltyExempt: !!document.getElementById('ncLoyaltyExempt').checked };
    state.customers.push(c); posSelectedCustomerId = c.id; logAudit('cliente_creado', name);
    saveState(); closeModal(); showToast('Cliente agregado', 'basil'); onSaved && onSaved();
  });
}

    <div class="space-y-4">

        <div>Orden #${sale.orderNumber} · ${sale.time}${sale.tableName? ' · '+esc(sale.tableName):''}</div>
        <div class="my-2 border-t border-line"></div>
        ${sale.items.map(i=>`<div class="text-sm">${i.qty} x ${esc(i.name)}${i.note?`<div class="italic text-muted text-[11px]">↳ ${esc(i.note)}</div>`:''}</div>`).join('')}
      </div>

      ${sale.paid ? `
      <div class="surface-2 rounded-lg p-4">
        <div class="text-center font-display text-base mb-1">${esc(state.settings.businessName)}</div>
        <div class="text-xs text-muted text-center mb-3">Recibo de cliente</div>
        <div class="font-mono text-xs space-y-1">
          ${sale.items.map(i=>`<div class="flex justify-between"><span>${i.qty} x ${esc(i.name)}</span><span>${fmt(i.price*i.qty)}</span></div>${i.qty>1?`<div class="text-right text-muted" style="font-size:10px;">@ ${fmt(i.price)} c/u</div>`:''}`).join('')}
          <div class="border-t border-line my-2"></div>
          ${sale.discount ? `<div class="flex justify-between"><span>Subtotal</span><span>${fmt(sale.subtotal!=null?sale.subtotal:sale.total)}</span></div><div class="flex justify-between ember"><span>Descuento</span><span>-${fmt(sale.discount.amount)}</span></div>` : ''}
          ${sale.pointsRedeemedValue>0 ? `<div class="flex justify-between gold"><span>Puntos canjeados</span><span>-${fmt(sale.pointsRedeemedValue)}</span></div>` : ''}
          <div class="flex justify-between font-semibold text-sm"><span>Total</span><span>${fmt(sale.total)}</span></div>
          ${sale.tip>0 ? `<div class="flex justify-between"><span>Propina</span><span>+${fmt(sale.tip)}</span></div><div class="flex justify-between font-semibold"><span>Total cobrado</span><span>${fmt(round2(sale.total+sale.tip))}</span></div>` : ''}
          <div class="flex justify-between text-muted"><span>Pago</span><span>${sale.paymentMethod||'—'} · Pagada</span></div>
          ${sale.payment?.change!=null ? `<div class="flex justify-between text-muted"><span>Vuelto</span><span>${fmt(sale.payment.change)}</span></div>`:''}

/* =========================================================================
   IMPRESIÓN DIRECTA (QZ Tray) — envía el ticket a una impresora elegida
   sin pasar por el diálogo de impresión del navegador. Si QZ Tray no está
   instalado/conectado, cae automáticamente en la impresión normal.
   ========================================================================= */
let qzConnected = false;
async function qzConnect(){
  if(typeof qz === 'undefined') return false;
  try{
    if(qz.websocket.isActive()){ qzConnected = true; return true; }
    await qz.websocket.connect();
    qzConnected = true; return true;
  }catch(e){ console.error('QZ Tray:', e); qzConnected = false; return false; }
}
async function qzListPrinters(){
  const ok = await qzConnect();
  if(!ok) return null;
  try{ return await qz.printers.find(); }catch(e){ console.error(e); return null; }
}
async function qzPrintHTML(printerName, html){
  if(!printerName) return false;
  const ok = await qzConnect(); if(!ok) return false;
  try{
    const config = qz.configs.create(printerName);
    const wrapped = `<html><body style="margin:0;width:80mm;font-family:monospace;">${html}</body></html>`;
    await qz.print(config, [{ type:'pixel', format:'html', flavor:'plain', data: wrapped }]);
    return true;
  }catch(e){ console.error('QZ print:', e); return false; }
}
async function printReceipt(html, target='customer'){
  const p = state.settings.printers || {};
  const printerName = target==='kitchen' ? p.kitchenPrinter : target==='report' ? p.reportPrinter : p.customerPrinter;

  if(p.directPrint && printerName){
    /* 1) Impresión nativa de Electron — la vía principal. No requiere instalar nada aparte:
       manda el ticket directo a la impresora elegida en Ajustes, sin ningún diálogo. */
    if(window.nativePrint){
      try{
        const wrapped = `<html><body style="margin:0;width:80mm;font-family:monospace;">${html}</body></html>`;
        const res = await window.nativePrint.silent(wrapped, printerName);
        if(res && res.success){ showToast('Impreso en '+printerName, 'basil'); return; }
        console.error('Impresión directa falló:', res && res.reason);
      }catch(e){ console.error('Impresión directa:', e); }
    }
    /* 2) QZ Tray — alternativa para cuando no hay impresión nativa disponible (ej. abierto en
       un navegador normal en vez de la app instalada) o si la nativa no pudo imprimir. */
    if(typeof qz !== 'undefined'){
      showToast('Enviando a '+printerName+'…');
      const ok = await qzPrintHTML(printerName, html);
      if(ok){ showToast('Impreso en '+printerName, 'basil'); return; }
    }
    showToast('No se pudo imprimir directo en '+printerName+', se abrirá el diálogo de impresión', 'danger');
  }
  const area = document.getElementById('printArea');
  area.innerHTML = html;
  window.print();
}

function renderVentas(root){

  if(f.to) rows = rows.filter(s=>s.date <= f.to);
  if(f.status) rows = rows.filter(s=>s.status===f.status);

  root.innerHTML = `
    <div class="flex items-center justify-between mb-4"><div class="font-display text-xl">Historial de ventas</div><div class="text-xs text-muted">${rows.length} resultados</div></div>

      <table class="w-full text-sm">
        <thead class="surface-2 text-muted text-left uppercase text-[11px]"><tr><th class="p-3">#</th><th class="p-3">Fecha</th><th class="p-3">Cliente</th><th class="p-3">Mesa / Canal</th><th class="p-3">Cocina</th><th class="p-3">Pago</th><th class="p-3">Total</th><th class="p-3"></th></tr></thead>
        <tbody>${rows.map(s=>`
          <tr class="border-t border-line">
            <td class="p-3 font-mono">#${s.orderNumber}</td><td class="p-3">${s.date} ${s.time}</td>
            <td class="p-3">${esc(s.customerName||'Mostrador')}</td><td class="p-3">${esc(s.tableName || s.channelName || '-')}</td>
            <td class="p-3"><span class="badge text-[10px] px-2 py-1 rounded-full ${s.status==='pendiente'?'surface-3':s.status==='cancelada'?'surface-3 ember':'surface-2'}">${s.status}</span></td>
            <td class="p-3"><span class="badge text-[10px] px-2 py-1 rounded-full ${s.paid?'surface-2 basil':'surface-3 ember'}">${s.paid ? (s.paymentMethod||'Pagada') : 'Sin cobrar'}</span></td>
            <td class="p-3 font-mono">${fmt(s.total)}${s.tip?`<div class="text-[10px] text-muted">+${fmt(s.tip)} propina</div>`:''}${s.discount?`<div class="text-[10px] ember">-${fmt(s.discount.amount)} desc.</div>`:''}</td>
            <td class="p-3 space-x-1">
              <button data-view="${s.id}" class="text-xs px-2 py-1 rounded-lg surface-2">Ver</button>
              ${!s.paid && s.status==='pendiente' ? `<button data-charge="${s.id}" class="text-xs px-2 py-1 rounded-lg bg-ember text-white">Cobrar</button>` : ''}
              ${!s.paid && s.status!=='cancelada' ? `<button data-cancel="${s.id}" class="text-xs px-2 py-1 rounded-lg text-red-500">Cancelar</button>` : ''}
              ${caps().deleteSales ? `<button data-del="${s.id}" class="text-xs px-2 py-1 rounded-lg text-red-500">Eliminar</button>` : ''}
            </td>
          </tr>`).join('') || `<tr><td class="p-3 text-muted" colspan="8">Sin resultados</td></tr>`}
        </tbody>
      </table>
    </div>
  `;
  ['vFrom','vTo','vStatus','vQ'].forEach(id=>{
    document.getElementById(id).addEventListener('input', (e)=>{
      ventasFilter = { ...ventasFilter, from:document.getElementById('vFrom').value, to:document.getElementById('vTo').value, status:document.getElementById('vStatus').value, q:document.getElementById('vQ').value };
      renderVentas(root);
    });

  document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click', ()=> openTicketModal(state.sales.find(s=>s.id===b.dataset.view))));
  document.querySelectorAll('[data-cancel]').forEach(b=>b.addEventListener('click', ()=>{
    const sale = state.sales.find(s=>s.id===b.dataset.cancel);
    const ov = openModal('Cancelar orden', `<div class="text-sm mb-4">¿Cancelar la orden #${sale.orderNumber} por ${fmt(sale.total)}? El inventario descontado se repondrá automáticamente.</div><button id="confirmCancelV" class="w-full py-2.5 rounded-lg text-white text-sm font-semibold" style="background:var(--danger)">Cancelar orden</button>`);

      renderVentas(root);
      openTicketModal(sale);
    });
  }));
  document.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', ()=>{

      state.sales = state.sales.filter(s=>s.id!==sale.id);
      logAudit('venta_eliminada', `Orden #${sale.orderNumber} · ${fmt(sale.total)}`);
      saveState(); closeModal(); renderVentas(root); showToast('Venta eliminada', 'basil');
    });
  }));
}
