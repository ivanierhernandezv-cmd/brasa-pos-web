function renderTables(root){
  root.innerHTML = `
    <div class="flex items-center justify-between mb-4"><div class="font-display text-xl">Mesas y espacios</div><button id="addTableBtn" class="px-4 py-2 rounded-lg bg-ember text-white text-sm font-semibold">+ Agregar mesa</button></div>
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
      ${state.tables.map(t=>{
        const sale = state.sales.find(s=>s.id===t.currentSaleId);
        return `<div class="table-card ${t.status} surface rounded-xl p-4 border-2">
          <div class="flex items-center justify-between mb-2"><div class="font-display text-lg">${esc(t.name)}</div><span>${t.status==='ocupada'?'●':'○'}</span></div>
          <div class="text-xs text-muted mb-3">${t.status==='ocupada' ? 'Ocupada' : 'Disponible'}</div>
          ${sale ? `<div class="text-xs mb-2">Orden #${sale.orderNumber} · ${fmt(sale.total)} ${sale.paid?'<span class="basil">· Pagada</span>':'<span class="ember">· Sin cobrar</span>'}</div>
            <button data-view-sale="${sale.id}" class="w-full py-2 rounded-lg surface-2 text-xs font-semibold mb-1">Ver orden</button>
            ${sale.paid
              ? `<button data-free-table="${t.id}" class="w-full py-2 rounded-lg bg-ember text-white text-xs font-semibold">Cerrar mesa</button>`
              : `<button data-charge-table="${sale.id}|${t.id}" class="w-full py-2 rounded-lg bg-ember text-white text-xs font-semibold mb-1">Cobrar y cerrar mesa</button>
                 <div class="grid grid-cols-2 gap-1 mb-1">
                   <button data-transfer-table="${t.id}" class="py-1.5 rounded-lg surface-2 text-[11px] font-semibold">Transferir</button>
                   <button data-merge-table="${t.id}" class="py-1.5 rounded-lg surface-2 text-[11px] font-semibold">Unir mesa</button>
                 </div>
                 <button data-cancel-table-order="${t.id}" class="w-full py-1.5 rounded-lg surface-2 text-red-500 text-[11px] font-semibold">Cancelar pedido</button>`}`
            : `<button data-del-table="${t.id}" class="w-full py-2 rounded-lg surface-2 text-xs text-red-500">Eliminar mesa</button>`}
        </div>`;
      }).join('')}
    </div>
  `;
  document.getElementById('addTableBtn').addEventListener('click', ()=>{
    const body = `${field('Nombre de la mesa', `<input id="tName" class="${inputCls}" placeholder="Ej. Mesa 7 / Barra 3">`)}<button id="tSave" class="w-full py-2.5 rounded-lg bg-ember text-white text-sm font-semibold mt-2">Agregar</button>`;
    const ov = openModal('Nueva mesa', body);
    ov.querySelector('#tSave').addEventListener('click', ()=>{ const name = document.getElementById('tName').value.trim(); if(!name) return; state.tables.push({ id: uid('table'), name, status:'disponible', currentSaleId:null }); saveState(); closeModal(); renderTables(root); });
  });
  document.querySelectorAll('[data-free-table]').forEach(b=>b.addEventListener('click', ()=>{
    const t = state.tables.find(x=>x.id===b.dataset.freeTable); const sale = state.sales.find(s=>s.id===t.currentSaleId);
    if(sale) sale.status = 'entregada'; t.status='disponible'; t.currentSaleId=null; saveState(); renderTables(root); showToast('Mesa liberada', 'basil');
  }));
  document.querySelectorAll('[data-charge-table]').forEach(b=>b.addEventListener('click', ()=>{
    const [saleId, tableId] = b.dataset.chargeTable.split('|');
    const sale = state.sales.find(s=>s.id===saleId); const t = state.tables.find(x=>x.id===tableId);
    openPaymentModal(sale, ()=>{ t.status='disponible'; t.currentSaleId=null; saveState(); showToast('Mesa cerrada', 'basil'); renderTables(root); openTicketModal(sale); });
  }));
  document.querySelectorAll('[data-view-sale]').forEach(b=>b.addEventListener('click', ()=> openTicketModal(state.sales.find(s=>s.id===b.dataset.viewSale))));
  document.querySelectorAll('[data-del-table]').forEach(b=>b.addEventListener('click', ()=>{ state.tables = state.tables.filter(t=>t.id!==b.dataset.delTable); saveState(); renderTables(root); }));

  /* Transferencia de mesa: mover una orden activa a otra mesa disponible (audit: función C) */
  document.querySelectorAll('[data-transfer-table]').forEach(b=>b.addEventListener('click', ()=>{
    const t = state.tables.find(x=>x.id===b.dataset.transferTable); const sale = state.sales.find(s=>s.id===t.currentSaleId);
    const targets = state.tables.filter(x=>x.status==='disponible');
    if(!targets.length){ showToast('No hay mesas disponibles para transferir', 'danger'); return; }
    const body = `<div class="text-sm mb-3">Mover la orden #${sale.orderNumber} de ${esc(t.name)} a:</div>
      <select id="transferDest" class="${inputCls} mb-3">${targets.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select>
      <button id="confirmTransfer" class="w-full py-2.5 rounded-lg bg-ember text-white text-sm font-semibold">Transferir</button>`;
    const ov = openModal('Transferir mesa', body);
    ov.querySelector('#confirmTransfer').addEventListener('click', ()=>{
      const dest = state.tables.find(x=>x.id===document.getElementById('transferDest').value);
      t.status='disponible'; t.currentSaleId=null;
      dest.status='ocupada'; dest.currentSaleId=sale.id;
      sale.tableId=dest.id; sale.tableName=dest.name;
      logAudit('mesa_transferida', `Orden #${sale.orderNumber} de ${t.name} a ${dest.name}`);
      saveState(); closeModal(); renderTables(root); showToast('Orden transferida a '+dest.name, 'basil');
    });
  }));

  /* Unión de mesas: fusiona la cuenta de una mesa en otra cuando un grupo se agranda (audit: función C) */
  document.querySelectorAll('[data-merge-table]').forEach(b=>b.addEventListener('click', ()=>{
    const t = state.tables.find(x=>x.id===b.dataset.mergeTable); const sale = state.sales.find(s=>s.id===t.currentSaleId);
    const others = state.tables.filter(x=> x.id!==t.id && x.status==='ocupada' && x.currentSaleId && state.sales.find(s=>s.id===x.currentSaleId && !s.paid));
    if(!others.length){ showToast('No hay otra mesa con pedido sin cobrar para unir', 'danger'); return; }
    const body = `<div class="text-sm mb-3">Unir la cuenta de otra mesa a ${esc(t.name)} (orden #${sale.orderNumber}):</div>
      <select id="mergeSrc" class="${inputCls} mb-3">${others.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select>
      <button id="confirmMerge" class="w-full py-2.5 rounded-lg bg-ember text-white text-sm font-semibold">Unir a ${esc(t.name)}</button>`;
    const ov = openModal('Unir mesas', body);
    ov.querySelector('#confirmMerge').addEventListener('click', ()=>{
      const src = state.tables.find(x=>x.id===document.getElementById('mergeSrc').value);
      const srcSale = state.sales.find(s=>s.id===src.currentSaleId);
      sale.items = sale.items.concat(srcSale.items);
      sale.subtotal = round2((sale.subtotal!=null?sale.subtotal:sale.total) + (srcSale.subtotal!=null?srcSale.subtotal:srcSale.total));
      sale.total = round2(sale.total + srcSale.total);
      srcSale.status = 'cancelada'; // se fusiona en la otra orden; el stock ya estaba descontado en ambas, no se toca
      src.status='disponible'; src.currentSaleId=null;
      logAudit('mesas_unidas', `Orden #${srcSale.orderNumber} (${src.name}) unida a orden #${sale.orderNumber} (${t.name})`);
      saveState(); closeModal(); renderTables(root); showToast('Mesas unidas', 'basil');
    });
  }));

  /* Cancelar pedido de mesa con reversión de stock (corrección de auditoría #1) */
  document.querySelectorAll('[data-cancel-table-order]').forEach(b=>b.addEventListener('click', ()=>{
    const t = state.tables.find(x=>x.id===b.dataset.cancelTableOrder); const sale = state.sales.find(s=>s.id===t.currentSaleId);
    const ov = openModal('Cancelar pedido', `<div class="text-sm mb-4">¿Cancelar el pedido de ${esc(t.name)} (orden #${sale.orderNumber})? El inventario descontado se repondrá automáticamente.</div><button id="confirmCancelTable" class="w-full py-2.5 rounded-lg text-white text-sm font-semibold" style="background:var(--danger)">Cancelar pedido</button>`);
    ov.querySelector('#confirmCancelTable').addEventListener('click', ()=>{ cancelOrder(sale, 'Cancelada desde Mesas'); closeModal(); renderTables(root); showToast('Pedido cancelado, stock repuesto', 'basil'); });
  }));
}

/* Tabla de categorías: nombre + emoji + foto opcional. Alimenta el selector en Productos y el POS. */
function openCategoriesModal(onChange){
  function body(){
    return `
      <div class="space-y-2 mb-4">${state.categories.map(c=>`
        <div class="flex items-center gap-2 surface-2 rounded-lg px-3 py-2">
          ${c.image?`<img src="${c.image}" class="w-8 h-8 rounded-lg object-cover">`:`<span class="w-8 h-8 rounded-lg surface flex items-center justify-center">${c.emoji}</span>`}
          <span class="text-sm flex-1">${esc(c.name)}</span>
          <button data-cat-edit="${c.id}" class="text-xs px-2 py-1 rounded-lg surface">Editar</button>
          <button data-cat-del="${c.id}" class="text-xs px-2 py-1 rounded-lg text-red-500">Eliminar</button>
        </div>`).join('') || `<div class="text-sm text-muted">Aún no tienes categorías.</div>`}</div>
      <div class="border-t border-line pt-3">
        <div class="text-xs text-muted uppercase tracking-wide mb-2">Nueva categoría</div>
        <div class="grid grid-cols-[1fr_70px] gap-2 mb-2">
          <input id="catName" placeholder="Nombre (ej. Hamburguesas)" class="${inputCls}">
          <input id="catEmoji" placeholder="🍔" maxlength="8" class="${inputCls} text-center">
        </div>
        <input type="file" id="catPhoto" accept="image/*" class="${inputCls} mb-2">
        <button id="catAdd" class="w-full py-2.5 rounded-lg bg-ember text-white text-sm font-semibold">+ Agregar categoría</button>
      </div>`;
  }
  const ov = openModal('Categorías', body(), { wide:true });
  let newCatImage = null;
  function wire(){
    ov.querySelector('#catPhoto').addEventListener('change', (e)=>{ const f=e.target.files[0]; if(!f) return; resizeImageToBase64(f, 300, (b64)=>{ newCatImage = b64; showToast('Foto lista para guardar', 'basil'); }); });
    ov.querySelector('#catAdd').addEventListener('click', ()=>{
      const name = ov.querySelector('#catName').value.trim(); if(!name){ showToast('Escribe un nombre', 'danger'); return; }
      state.categories.push({ id: uid('cat'), name, emoji: ov.querySelector('#catEmoji').value||'🏷️', image: newCatImage });
      newCatImage = null; saveState(); refresh();
    });
    ov.querySelectorAll('[data-cat-del]').forEach(b=>b.addEventListener('click', ()=>{
      const inUse = state.products.some(p=>p.category === state.categories.find(c=>c.id===b.dataset.catDel)?.name);
      if(inUse){ showToast('No puedes eliminar una categoría con productos asignados. Reasígnalos primero.', 'danger'); return; }
      state.categories = state.categories.filter(c=>c.id!==b.dataset.catDel); saveState(); refresh();
    }));
    ov.querySelectorAll('[data-cat-edit]').forEach(b=>b.addEventListener('click', ()=>{
      const c = state.categories.find(x=>x.id===b.dataset.catEdit);
      const eb = openModal('Editar categoría', `
        <div class="grid grid-cols-[1fr_70px] gap-2 mb-2">
          <input id="ecName" value="${esc(c.name)}" class="${inputCls}">
          <input id="ecEmoji" value="${c.emoji}" maxlength="8" class="${inputCls} text-center">
        </div>
        <input type="file" id="ecPhoto" accept="image/*" class="${inputCls} mb-3">
        <button id="ecSave" class="w-full py-2.5 rounded-lg bg-ember text-white text-sm font-semibold">Guardar</button>`);
      let editImage = c.image;
      eb.querySelector('#ecPhoto').addEventListener('change', (e)=>{ const f=e.target.files[0]; if(!f) return; resizeImageToBase64(f, 300, (b64)=>{ editImage = b64; }); });
      eb.querySelector('#ecSave').addEventListener('click', ()=>{
        const oldName = c.name; c.name = eb.querySelector('#ecName').value.trim()||c.name; c.emoji = eb.querySelector('#ecEmoji').value||c.emoji; c.image = editImage;
        if(oldName !== c.name) state.products.filter(p=>p.category===oldName).forEach(p=>p.category=c.name); // mantiene el vínculo con los productos ya asignados
        saveState(); closeModal(); refresh();
      });
    }));
  }
  function refresh(){ ov.querySelector('.overflow-y-auto').innerHTML = body(); wire(); onChange && onChange(); }
  wire();
}

function renderProducts(root){
  root.innerHTML = `
    <div class="flex items-center justify-between mb-4"><div class="font-display text-xl">Productos y márgenes</div><div class="flex gap-2"><button id="manageCatBtn" class="px-4 py-2 rounded-lg surface-2 text-sm font-semibold">🏷️ Categorías</button><button id="importProdBtn" class="px-4 py-2 rounded-lg surface-2 text-sm font-semibold">📥 Importar Excel</button><button id="addProdBtn" class="px-4 py-2 rounded-lg bg-ember text-white text-sm font-semibold">+ Nuevo producto</button></div></div>
    <div class="surface rounded-xl overflow-hidden">
      <table class="w-full text-sm">
        <thead class="surface-2 text-muted text-left uppercase text-[11px]"><tr><th class="p-3"></th><th class="p-3">Producto</th><th class="p-3">Categoría</th><th class="p-3">Costo</th><th class="p-3">Precio venta</th><th class="p-3">Margen</th><th class="p-3">Inventario</th><th class="p-3"></th></tr></thead>
        <tbody>${state.products.map((p,pi)=>{
          const margin = p.price>0 ? (((p.price-p.costPrice)/p.price)*100).toFixed(0) : 0;
          const low = p.trackInventory && p.stock<=p.minStock;
          return `<tr class="border-t border-line"><td class="p-3"><span class="w-9 h-9 rounded-lg surface-2 flex items-center justify-center text-base overflow-hidden" data-prodrow-slot="${pi}">${p.emoji}</span></td><td class="p-3">${p.emoji} ${esc(p.name)}</td><td class="p-3 text-muted">${esc(p.category)}</td><td class="p-3 font-mono">${fmt(p.costPrice)}</td><td class="p-3 font-mono">${fmt(p.price)}</td><td class="p-3 font-mono basil">${margin}%</td>
            <td class="p-3">${p.trackInventory ? `<span class="badge text-[10px] px-2 py-1 rounded-full ${low?'':'surface-2'}" ${low?`style="background:var(--red-tint);color:var(--red)"`:''}>${p.stock} ${esc(p.unit||'')}${low?' ⚠':''}</span>` : `<span class="text-muted text-xs">No aplica</span>`}</td>
            <td class="p-3 space-x-1"><button data-edit-prod="${p.id}" class="text-xs surface-2 px-2 py-1 rounded-lg">Editar</button>${caps().deleteProducts?`<button data-del-prod="${p.id}" class="text-xs text-red-500">Eliminar</button>`:''}</td></tr>`;
        }).join('')}</tbody>
      </table>
    </div>
  `;
  { // fotos por lotes, para que una tabla con muchos productos con foto nunca trabe la pantalla
    let idx = 0; const withPhoto = state.products.map((p,pi)=>({pi,src:p.image})).filter(e=>e.src);
    function nextProdBatch(){
      withPhoto.slice(idx, idx+6).forEach(({pi,src})=>{ const el = root.querySelector(`[data-prodrow-slot="${pi}"]`); if(el) el.innerHTML = `<img src="${src}" class="w-full h-full object-cover">`; });
      idx += 6; if(idx < withPhoto.length) requestAnimationFrame(nextProdBatch);
    }
    if(withPhoto.length) requestAnimationFrame(nextProdBatch);
  }
  document.getElementById('manageCatBtn').addEventListener('click', ()=> openCategoriesModal(()=>renderProducts(root)));
  document.getElementById('importProdBtn').addEventListener('click', ()=>{
    const body = `
      <div class="text-sm mb-3">Sube un archivo Excel (.xlsx) con tus productos. Si no sabes cómo darle formato, descarga primero el ejemplo.</div>
      <button id="downloadTemplate" class="w-full py-2.5 rounded-lg surface-2 text-sm font-semibold mb-4">⬇️ Descargar plantilla de ejemplo</button>
      <div class="text-xs text-muted mb-2">Columnas esperadas: <span class="font-mono">Nombre, Categoria, PrecioCompra, PrecioVenta, Emoji</span> (Emoji es opcional).</div>
      <input type="file" id="prodFile" accept=".xlsx,.xls" class="${inputCls} mb-3">
      <div id="importPreview" class="text-xs text-muted mb-3"></div>
      <button id="confirmImport" class="w-full py-2.5 rounded-lg bg-ember text-white text-sm font-semibold" disabled>Importar productos</button>
    `;
    const ov = openModal('Importar productos desde Excel', body, { wide:true });
    let parsedRows = [];
    ov.querySelector('#downloadTemplate').addEventListener('click', ()=>{
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.json_to_sheet([
        { Nombre:'Pizza Hawaiana', Categoria:'Pizzas', PrecioCompra:6.0, PrecioVenta:15.5, Emoji:'🍕' },
        { Nombre:'Pincho de Camarón', Categoria:'Pinchos', PrecioCompra:3.5, PrecioVenta:8.0, Emoji:'🍢' },
        { Nombre:'Limonada', Categoria:'Bebidas', PrecioCompra:0.8, PrecioVenta:3.0, Emoji:'🥤' }
      ]);
      XLSX.utils.book_append_sheet(wb, ws, 'Productos');
      XLSX.writeFile(wb, 'plantilla-productos.xlsx');
    });
    ov.querySelector('#prodFile').addEventListener('change', (e)=>{
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev)=>{
        try{
          const wb = XLSX.read(ev.target.result, { type:'array' });
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(sheet);
          parsedRows = rows.map(r=>({
            name: String(r.Nombre||r.nombre||'').trim(),
            category: String(r.Categoria||r.categoria||'Otros').trim(),
            costPrice: parseFloat(r.PrecioCompra||r.precioCompra||0)||0,
            price: parseFloat(r.PrecioVenta||r.precioVenta||0)||0,
            emoji: String(r.Emoji||r.emoji||'🍽️').trim() || '🍽️'
          })).filter(r=>r.name && r.price>0);
          const preview = ov.querySelector('#importPreview');
          if(parsedRows.length){
            preview.innerHTML = `<span class="basil">${parsedRows.length} producto(s) listos para importar:</span> ${parsedRows.slice(0,5).map(r=>esc(r.name)).join(', ')}${parsedRows.length>5?'…':''}`;
            ov.querySelector('#confirmImport').disabled = false;
          } else {
            preview.innerHTML = `<span style="color:var(--danger)">No se encontraron filas válidas. Revisa que tengan Nombre y PrecioVenta.</span>`;
            ov.querySelector('#confirmImport').disabled = true;
          }
        }catch(err){ console.error(err); showToast('No se pudo leer el archivo', 'danger'); }
      };
      reader.readAsArrayBuffer(file);
    });
    ov.querySelector('#confirmImport').addEventListener('click', ()=>{
      parsedRows.forEach(r=>{
        if(!state.categories.some(c=>c.name===r.category)) state.categories.push({ id: uid('cat'), name:r.category, emoji:'📦', image:null });
        state.products.push({ id: uid('prod'), name:r.name, category:r.category, costPrice:r.costPrice, price:r.price, emoji:r.emoji, image:null, showInMenu:true, trackInventory:false, stock:0, minStock:0, unit:'unidad' });
      });
      logAudit('productos_importados', `${parsedRows.length} producto(s) desde Excel`);
      saveState(); closeModal(); renderProducts(root); showToast(parsedRows.length+' productos importados', 'basil');
    });
  });
  document.getElementById('addProdBtn').addEventListener('click', ()=>{
    const body = `${field('Nombre del producto', `<input id="pName" class="${inputCls}">`)}
      ${field('Categoría', state.categories.length ? `<select id="pCat" class="${inputCls}">${state.categories.map(c=>`<option value="${esc(c.name)}">${c.emoji} ${esc(c.name)}</option>`).join('')}</select>` : `<div class="text-xs" style="color:var(--danger)">Primero crea una categoría con el botón "🏷️ Categorías".</div>`)}
      ${field('Emoji', `<input id="pEmoji" class="${inputCls}" value="🍽️" maxlength="8">`)}
      ${field('Foto del producto (opcional)', `<input type="file" id="pPhoto" accept="image/*" class="${inputCls}">`)}
      ${field('Precio de compra (costo)', `<input id="pCost" type="number" step="0.01" class="${inputCls}">`)}${field('Precio de venta', `<input id="pPrice" type="number" step="0.01" class="${inputCls}">`)}
      <label class="flex items-center gap-2 text-sm my-3"><input type="checkbox" id="pTrack"> Este producto maneja inventario (ej. bebidas embotelladas)</label>
      <div id="pInvWrap" class="hidden grid grid-cols-3 gap-2">
        ${field('Stock inicial', `<input id="pStock" type="number" step="1" value="0" class="${inputCls}">`)}
        ${field('Stock mínimo', `<input id="pMinStock" type="number" step="1" value="0" class="${inputCls}">`)}
        ${field('Unidad', `<input id="pUnit" value="unidad" class="${inputCls}">`)}
      </div>
      <button id="pSave" class="w-full py-2.5 rounded-lg bg-ember text-white text-sm font-semibold mt-2">Guardar producto</button>`;
    const ov = openModal('Nuevo producto', body, { wide:true });
    let newProductImage = null;
    ov.querySelector('#pPhoto')?.addEventListener('change', (e)=>{ const f=e.target.files[0]; if(!f) return; resizeImageToBase64(f, 500, (b64)=>{ newProductImage = b64; showToast('Foto lista para guardar', 'basil'); }); });
    ov.querySelector('#pTrack').addEventListener('change', (e)=> ov.querySelector('#pInvWrap').classList.toggle('hidden', !e.target.checked));
    ov.querySelector('#pSave').addEventListener('click', ()=>{
      const name = document.getElementById('pName').value.trim(); const price = parseFloat(document.getElementById('pPrice').value); const costPrice = parseFloat(document.getElementById('pCost').value)||0;
      if(!name || !price){ showToast('Completa nombre y precio de venta', 'danger'); return; }

        trackInventory, stock: trackInventory ? (parseFloat(document.getElementById('pStock').value)||0) : 0, minStock: trackInventory ? (parseFloat(document.getElementById('pMinStock').value)||0) : 0, unit: document.getElementById('pUnit').value||'unidad' });
      logAudit('producto_creado', name);
      saveState(); closeModal(); renderProducts(root); showToast('Producto agregado', 'basil');
    });
  });
  document.querySelectorAll('[data-edit-prod]').forEach(b=>b.addEventListener('click', ()=>{
    const p = state.products.find(x=>x.id===b.dataset.editProd);

      ${field('Emoji', `<input id="ePEmoji" value="${p.emoji}" maxlength="8" class="${inputCls}">`)}
      ${field('Foto del producto (opcional)', `${p.image?`<img src="${p.image}" class="w-16 h-16 rounded-lg object-cover mb-2">`:''}<input type="file" id="ePPhoto" accept="image/*" class="${inputCls}">`)}
      ${field('Precio de compra (costo)', `<input id="ePCost" type="number" step="0.01" value="${p.costPrice}" class="${inputCls}">`)}${field('Precio de venta', `<input id="ePPrice" type="number" step="0.01" value="${p.price}" class="${inputCls}">`)}
      <label class="flex items-center gap-2 text-sm my-3"><input type="checkbox" id="ePTrack" ${p.trackInventory?'checked':''}> Este producto maneja inventario</label>
      <div id="ePInvWrap" class="grid grid-cols-3 gap-2 ${p.trackInventory?'':'hidden'}">

        ${field('Unidad', `<input id="ePUnit" value="${esc(p.unit||'unidad')}" class="${inputCls}">`)}
      </div>
      <button id="ePSave" class="w-full py-2.5 rounded-lg bg-ember text-white text-sm font-semibold mt-2">Guardar cambios</button>`;
    const ov = openModal('Editar producto', body, { wide:true });
    let editProductImage = p.image || null;
    ov.querySelector('#ePPhoto').addEventListener('change', (e)=>{ const f=e.target.files[0]; if(!f) return; resizeImageToBase64(f, 500, (b64)=>{ editProductImage = b64; showToast('Foto lista para guardar', 'basil'); }); });
    ov.querySelector('#ePTrack').addEventListener('change', (e)=> ov.querySelector('#ePInvWrap').classList.toggle('hidden', !e.target.checked));
    ov.querySelector('#ePSave').addEventListener('click', ()=>{
      const oldStock = p.stock||0;
      p.name = document.getElementById('ePName').value.trim()||p.name;
      p.category = document.getElementById('ePCat').value||p.category;
      p.emoji = document.getElementById('ePEmoji').value||p.emoji;
      p.image = editProductImage;
      p.costPrice = parseFloat(document.getElementById('ePCost').value)||0;
      p.price = parseFloat(document.getElementById('ePPrice').value)||p.price;
      p.trackInventory = document.getElementById('ePTrack').checked;
      if(p.trackInventory){
        const newStock = parseFloat(document.getElementById('ePStock').value)||0;
        p.minStock = parseFloat(document.getElementById('ePMinStock').value)||0;
        p.unit = document.getElementById('ePUnit').value||'unidad';
        if(newStock !== oldStock){ adjustStock(p.id, newStock-oldStock, 'ajuste', 'Edición manual del producto'); }
      }
      logAudit('producto_editado', p.name);
      saveState(); closeModal(); renderProducts(root); showToast('Producto actualizado', 'basil');
    });
  }));
  document.querySelectorAll('[data-del-prod]').forEach(b=>b.addEventListener('click', ()=>{ const p=state.products.find(x=>x.id===b.dataset.delProd); state.products = state.products.filter(p=>p.id!==b.dataset.delProd); logAudit('producto_eliminado', p?.name||''); saveState(); renderProducts(root); }));
}

/* =========================================================================
   INVENTARIO — stock, alertas de mínimo y ajustes manuales
   ========================================================================= */

function renderStock(root){
  const items = state.products.filter(p=>p.trackInventory);
  const low = items.filter(p=>p.stock<=p.minStock);
  const out = items.filter(p=>p.stock<=0);
  const totalValue = items.reduce((a,p)=>a+(p.stock*p.costPrice),0);
  root.innerHTML = `
    <div class="flex items-center justify-between mb-4"><div class="font-display text-xl">Inventario</div><button id="addAdjustBtn" class="px-4 py-2 rounded-lg bg-ember text-white text-sm font-semibold">+ Ajuste manual</button></div>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
      ${kpiCard('Productos con inventario', items.length)}
      ${kpiCard('Stock bajo mínimo', low.length, low.length>0)}
      ${kpiCard('Agotados', out.length, out.length>0)}
      ${kpiCard('Valor total en stock', fmt(totalValue))}
    </div>
    ${low.length ? `<div class="surface rounded-xl p-4 mb-6" style="border-color:var(--red)">
      <div class="text-sm font-semibold ember mb-2">⚠ Productos por reponer</div>
      <div class="flex flex-wrap gap-2">${low.map(p=>`<span class="badge text-xs px-3 py-1.5 rounded-full" style="background:var(--red-tint);color:var(--red)">${p.emoji} ${esc(p.name)}: ${p.stock} ${esc(p.unit||'')} (mín. ${p.minStock})</span>`).join('')}</div>
    </div>` : ''}
    <div class="surface rounded-xl overflow-hidden mb-6">
      <table class="w-full text-sm">
        <thead class="surface-2 text-muted text-left uppercase text-[11px]"><tr><th class="p-3">Producto</th><th class="p-3">Stock actual</th><th class="p-3">Mínimo</th><th class="p-3">Costo unit. (PC)</th><th class="p-3">Precio venta</th><th class="p-3">Valor en stock</th><th class="p-3">Estado</th><th class="p-3"></th></tr></thead>
        <tbody>${items.length ? items.map(p=>{
          const status = p.stock<=0 ? { t:'Agotado', c:'var(--danger)' } : p.stock<=p.minStock ? { t:'Bajo', c:'var(--red)' } : { t:'OK', c:'var(--basil)' };
          return `<tr class="border-t border-line">
            <td class="p-3">${p.emoji} ${esc(p.name)}</td><td class="p-3 font-mono">${p.stock} ${esc(p.unit||'')}</td><td class="p-3 font-mono text-muted">${p.minStock}</td>
            <td class="p-3 font-mono">${fmt(p.costPrice)}</td><td class="p-3 font-mono">${fmt(p.price)}</td><td class="p-3 font-mono">${fmt(p.stock*p.costPrice)}</td>
            <td class="p-3"><span class="badge text-[10px] px-2 py-1 rounded-full surface-2" style="color:${status.c}">${status.t}</span></td>
            <td class="p-3"><button data-quick-adjust="${p.id}" class="text-xs px-2 py-1 rounded-lg surface-2">Ajustar</button></td>
          </tr>`;
        }).join('') : `<tr><td class="p-3 text-muted" colspan="8">Ningún producto tiene inventario activado. Actívalo desde "Productos" (Editar → Este producto maneja inventario).</td></tr>`}</tbody>
      </table>
    </div>
    <div class="font-display text-lg mb-3">Últimos movimientos</div>
    <div class="surface rounded-xl overflow-hidden">
      <table class="w-full text-sm">
        <thead class="surface-2 text-muted text-left uppercase text-[11px]"><tr><th class="p-3">Fecha</th><th class="p-3">Producto</th><th class="p-3">Tipo</th><th class="p-3">Cambio</th><th class="p-3">Motivo</th><th class="p-3">Usuario</th></tr></thead>
        <tbody>${state.inventoryMovements.slice().reverse().slice(0,40).map(m=>`<tr class="border-t border-line">
          <td class="p-3">${new Date(m.date).toLocaleString('es-ES')}</td><td class="p-3">${esc(m.productName)}</td>
          <td class="p-3 text-muted capitalize">${m.type}</td>
          <td class="p-3 font-mono" style="color:${m.qtyChange<0?'var(--red)':'var(--basil)'}">${m.qtyChange>0?'+':''}${m.qtyChange}</td>
          <td class="p-3 text-muted">${esc(m.reason||'')}</td><td class="p-3 text-muted">${esc(m.userName)}</td>
        </tr>`).join('') || `<tr><td class="p-3 text-muted" colspan="6">Sin movimientos aún</td></tr>`}</tbody>
      </table>
    </div>
  `;
  function openAdjustModal(productId){
    const pre = items.find(p=>p.id===productId);
    const body = `
      ${field('Producto', `<input id="adjProduct" list="adjProductList" value="${pre?esc(pre.name):''}" class="${inputCls}" placeholder="Busca el producto...">`)}
      <datalist id="adjProductList">${items.map(p=>`<option value="${esc(p.name)}">`).join('')}</datalist>
      <div id="adjStockHint" class="text-xs text-muted mb-2">${pre?`Stock actual: ${pre.stock} ${esc(pre.unit||'')}`:''}</div>
      ${field('Tipo de ajuste', `<select id="adjType" class="${inputCls}"><option value="add">Sumar al stock (entrada)</option><option value="sub">Restar del stock (pérdida, daño, conteo)</option></select>`)}
      ${field('Cantidad', `<input id="adjQty" type="number" step="1" min="1" class="${inputCls}">`)}
      ${field('Motivo', `<input id="adjReason" class="${inputCls}" placeholder="Ej. Conteo físico, producto dañado, donación...">`)}
      <button id="adjSave" class="w-full py-2.5 rounded-lg bg-ember text-white text-sm font-semibold mt-2">Guardar ajuste</button>
    `;
    const ov = openModal('Ajuste manual de inventario', body);
    const prodInput = ov.querySelector('#adjProduct');
    prodInput.addEventListener('input', ()=>{
      const m = items.find(p=>p.name.toLowerCase()===prodInput.value.trim().toLowerCase());
      ov.querySelector('#adjStockHint').textContent = m ? `Stock actual: ${m.stock} ${m.unit||''}` : '';
    });
    ov.querySelector('#adjSave').addEventListener('click', ()=>{
      const match = items.find(p=>p.name.toLowerCase()===prodInput.value.trim().toLowerCase());
      if(!match){ showToast('Selecciona un producto válido de la lista', 'danger'); return; }
      const qty = parseFloat(document.getElementById('adjQty').value);
      const type = document.getElementById('adjType').value;
      const reason = document.getElementById('adjReason').value.trim();
      if(!qty || qty<=0){ showToast('Ingresa una cantidad válida', 'danger'); return; }
      adjustStock(match.id, type==='add'?qty:-qty, 'ajuste', reason||'Ajuste manual');
      logAudit('inventario_ajustado', `${match.name} · ${type==='add'?'+':'-'}${qty} · ${reason}`);
      saveState(); closeModal(); renderStock(root); showToast('Inventario ajustado', 'basil');
    });
  }
  document.getElementById('addAdjustBtn').addEventListener('click', ()=>{
    if(!items.length){ showToast('Primero activa el inventario en algún producto (Productos → Editar)', 'danger'); return; }
    openAdjustModal(null);
  });
  document.querySelectorAll('[data-quick-adjust]').forEach(b=>b.addEventListener('click', ()=> openAdjustModal(b.dataset.quickAdjust)));
}

/* =========================================================================
   COMPRAS / GASTOS
   ========================================================================= */
function renderInventory(root){
  const totalPurchases = purchasesTotal(); const totalIncome = totalRevenue();
  const invProducts = state.products.filter(p=>p.trackInventory);
  root.innerHTML = `
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <div class="surface rounded-xl p-5"><div class="text-xs text-muted mb-1 uppercase">Ingresos</div><div class="font-display text-2xl basil">${fmt(totalIncome)}</div></div>
      <div class="surface rounded-xl p-5"><div class="text-xs text-muted mb-1 uppercase">Egresos</div><div class="font-display text-2xl ember">${fmt(totalPurchases)}</div></div>
      <div class="surface rounded-xl p-5"><div class="text-xs text-muted mb-1 uppercase">Flujo neto</div><div class="font-display text-2xl">${fmt(totalIncome-totalPurchases)}</div></div>
    </div>
    <div class="flex items-center justify-between mb-4"><div class="font-display text-xl">Compras y gastos</div><button id="addPurchaseBtn" class="px-4 py-2 rounded-lg bg-ember text-white text-sm font-semibold">+ Registrar compra</button></div>
    <div class="surface rounded-xl overflow-hidden">
      <table class="w-full text-sm">
        <thead class="surface-2 text-muted text-left uppercase text-[11px]"><tr><th class="p-3">Fecha</th><th class="p-3">Concepto</th><th class="p-3">Categoría</th><th class="p-3">Pago</th><th class="p-3">Inventario</th><th class="p-3">Monto</th></tr></thead>
        <tbody>${state.purchases.slice().reverse().map(p=>`<tr class="border-t border-line"><td class="p-3">${p.date}</td><td class="p-3">${esc(p.concept)}</td><td class="p-3 text-muted">${esc(p.category)}</td><td class="p-3 text-muted">${esc(p.method)}${p.bank?' ('+esc(p.bank)+')':''}</td><td class="p-3 text-muted">${p.stockQty ? `+${p.stockQty} ${esc(p.stockProductName||'')}` : '—'}</td><td class="p-3 font-mono">${fmt(p.amount)}</td></tr>`).join('') || `<tr><td class="p-3 text-muted" colspan="6">Sin registros aún</td></tr>`}</tbody>
      </table>
    </div>
  `;
  document.getElementById('addPurchaseBtn').addEventListener('click', ()=>{
    const body = `
      ${field('Fecha', `<input id="puDate" type="date" value="${todayStr()}" class="${inputCls}">`)}
      ${field('¿Qué compraste?', `<input id="puItem" list="puItemList" class="${inputCls}" placeholder="Busca un producto de tu inventario, o escribe algo nuevo (ej. Alquiler, gas...)">`)}
      <datalist id="puItemList">${invProducts.map(p=>`<option value="${esc(p.name)}">`).join('')}</datalist>
      <div id="puDynamic" class="mb-3"></div>
      ${field('Categoría de gasto', `<select id="puCat" class="${inputCls}">${state.expenseCategories.map(c=>`<option>${esc(c.name)}</option>`).join('')}</select>`)}
      ${field('Método de pago', `<select id="puMethod" class="${inputCls}"><option>Efectivo</option><option>Débito</option><option>Crédito</option><option>Transferencia</option></select>`)}
      <div id="puBankWrap" class="hidden">${field('Banco', `<select id="puBank" class="${inputCls}">${state.banks.map(b=>`<option>${esc(b.name)}</option>`).join('')}</select>`)}</div>
      ${field('Monto total pagado (USD)', `<input id="puAmount" type="number" step="0.01" class="${inputCls}">`)}
      <button id="puSave" class="w-full py-2.5 rounded-lg bg-ember text-white text-sm font-semibold mt-2">Registrar compra</button>
    `;
    const ov = openModal('Registrar compra', body, { wide:true });
    ov.querySelector('#puMethod').addEventListener('change', (e)=> ov.querySelector('#puBankWrap').classList.toggle('hidden', e.target.value!=='Transferencia'));

    const itemInput = ov.querySelector('#puItem');
    const dyn = ov.querySelector('#puDynamic');
    let matchedProduct = null, creatingNew = false;

    function findMatch(text){ return invProducts.find(p=>p.name.toLowerCase()===text.trim().toLowerCase()); }
    function renderDynamic(){
      const text = itemInput.value.trim();
      matchedProduct = findMatch(text);
      creatingNew = false;
      if(matchedProduct){
        dyn.innerHTML = `
          <div class="text-xs surface-2 rounded-lg p-2.5 mb-2">📦 Se vincula a inventario: <strong>${matchedProduct.emoji} ${esc(matchedProduct.name)}</strong> — stock actual: ${matchedProduct.stock} ${esc(matchedProduct.unit||'')}</div>
          ${field('Cantidad comprada', `<input id="puQty" type="number" step="1" min="1" value="1" class="${inputCls}">`)}
          <button type="button" id="puUseCost" class="text-xs ember underline mb-2">Usar costo sugerido (cantidad × ${fmt(matchedProduct.costPrice)} c/u)</button>
        `;
        const qtyInput = ov.querySelector('#puQty');
        ov.querySelector('#puUseCost').addEventListener('click', ()=>{
          const qty = parseFloat(qtyInput.value)||0;
          ov.querySelector('#puAmount').value = (qty*matchedProduct.costPrice).toFixed(2);
        });
      } else if(text){
        dyn.innerHTML = `
          <div class="text-xs text-muted mb-2">"${esc(text)}" no está en tu inventario todavía.</div>
          <button type="button" id="puCreateToggle" class="text-xs px-3 py-1.5 rounded-lg surface-2 font-semibold mb-2">+ Agregarlo a mi inventario</button>
          <div id="puNewFields" class="hidden surface-2 rounded-lg p-3 space-y-2">
            <div class="grid grid-cols-2 gap-2">
              ${field('Categoría del producto', `<input id="puNewCat" class="${inputCls}" placeholder="Ej. Bebidas">`)}
              ${field('Emoji', `<input id="puNewEmoji" value="📦" maxlength="8" class="${inputCls}">`)}
              ${field('Costo unitario', `<input id="puNewCost" type="number" step="0.01" class="${inputCls}">`)}
              ${field('Precio de venta', `<input id="puNewPrice" type="number" step="0.01" class="${inputCls}">`)}
              ${field('Stock mínimo', `<input id="puNewMin" type="number" step="1" value="0" class="${inputCls}">`)}
              ${field('Unidad', `<input id="puNewUnit" value="unidad" class="${inputCls}">`)}
            </div>
            ${field('Cantidad comprada (stock inicial)', `<input id="puNewQty" type="number" step="1" min="1" value="1" class="${inputCls}">`)}
          </div>
        `;
        ov.querySelector('#puCreateToggle').addEventListener('click', ()=>{
          creatingNew = !creatingNew;
          ov.querySelector('#puNewFields').classList.toggle('hidden', !creatingNew);
          ov.querySelector('#puCreateToggle').textContent = creatingNew ? '✕ No agregar a inventario' : '+ Agregarlo a mi inventario';
        });
      } else { dyn.innerHTML = ''; }
    }
    itemInput.addEventListener('input', renderDynamic);

    ov.querySelector('#puSave').addEventListener('click', ()=>{
      const concept = itemInput.value.trim();
      const amount = parseFloat(document.getElementById('puAmount').value);
      if(!concept || !amount){ showToast('Escribe qué compraste y el monto', 'danger'); return; }

      let stockProductId=null, stockProductName=null, stockQty=null;

      if(matchedProduct){
        const qty = parseFloat(document.getElementById('puQty')?.value)||0;
        if(qty>0){ adjustStock(matchedProduct.id, qty, 'compra', concept); stockProductId=matchedProduct.id; stockProductName=matchedProduct.name; stockQty=qty; }
      } else if(creatingNew){
        const cost = parseFloat(document.getElementById('puNewCost').value)||0;
        const price = parseFloat(document.getElementById('puNewPrice').value)||0;
        const qty = parseFloat(document.getElementById('puNewQty').value)||0;
        if(!price){ showToast('Indica el precio de venta del nuevo producto', 'danger'); return; }
        const newProd = { id: uid('prod'), name: concept, category: document.getElementById('puNewCat').value||'Otros', costPrice:cost, price, emoji: document.getElementById('puNewEmoji').value||'📦', trackInventory:true, stock:0, minStock: parseFloat(document.getElementById('puNewMin').value)||0, unit: document.getElementById('puNewUnit').value||'unidad' };
        state.products.push(newProd);
        logAudit('producto_creado', newProd.name+' (desde compra)');
        if(qty>0){ adjustStock(newProd.id, qty, 'compra', concept); stockProductId=newProd.id; stockProductName=newProd.name; stockQty=qty; }
      }

      state.purchases.push({ id: uid('pur'), date: document.getElementById('puDate').value || todayStr(), concept, category: document.getElementById('puCat').value, method: document.getElementById('puMethod').value, bank: document.getElementById('puMethod').value==='Transferencia' ? document.getElementById('puBank').value : null, amount, stockProductId, stockProductName, stockQty });
      logAudit('compra_registrada', `${concept} · ${fmt(amount)}${stockProductName?` · +${stockQty} ${stockProductName} en inventario`:''}`);
      saveState(); closeModal(); renderInventory(root); showToast('Compra registrada', 'basil');
    });
  });
}

/* =========================================================================
   POR COBRAR — cuentas fiadas (clientes que pagan después)
   ========================================================================= */
function renderPorCobrar(root){
  const pending = state.sales.filter(s=> s.fiado && !s.paid && s.status!=='cancelada');
  const byCustomer = {};
  pending.forEach(s=>{ const k=s.customerId||'sin'; if(!byCustomer[k]) byCustomer[k] = { name:s.customerName||'Cliente', whatsapp:s.customerWhatsapp, sales:[] }; byCustomer[k].sales.push(s); });
  const totalOwed = pending.reduce((a,s)=>a+s.total,0);
  root.innerHTML = `
    <div class="flex items-center justify-between mb-4"><div class="font-display text-xl">Cuentas por cobrar</div><div class="font-display text-2xl ember">${fmt(totalOwed)}</div></div>
    ${Object.keys(byCustomer).length ? Object.values(byCustomer).map(g=>`
      <div class="surface rounded-xl p-4 mb-3">
        <div class="flex items-center justify-between mb-2">
          <div class="font-display text-lg">${esc(g.name)}</div>
          <div class="font-mono font-semibold">${fmt(g.sales.reduce((a,s)=>a+s.total,0))}</div>
        </div>
        <div class="space-y-2">
          ${g.sales.map(s=>`<div class="surface-2 rounded-lg p-3 flex items-center justify-between text-sm">
            <div>Orden #${s.orderNumber} · ${s.date}<div class="text-xs text-muted font-mono">${fmt(s.total)}</div></div>
            <button data-charge-fiado="${s.id}" class="px-3 py-2 rounded-lg bg-ember text-white text-xs font-semibold">Cobrar</button>
          </div>`).join('')}
        </div>
      </div>`).join('') : `<div class="surface rounded-xl p-8 text-center text-sm text-muted">No hay cuentas pendientes por cobrar</div>`}
  `;
  document.querySelectorAll('[data-charge-fiado]').forEach(b=>b.addEventListener('click', ()=>{
    const sale = state.sales.find(s=>s.id===b.dataset.chargeFiado);
    openPaymentModal(sale, ()=>{ renderPorCobrar(root); openTicketModal(sale); });
  }));
}

/* =========================================================================
   CORTES DE CAJA — apertura/cierre de turno con cuadratura de efectivo
   ========================================================================= */
function shiftReportHTML(shift){
  const sales = state.sales.filter(s=> s.shiftId===shift.id);
  const paidSales = sales.filter(s=>s.paid);
  const totals = paymentTotals(paidSales);
  const grandTotal = paidSales.reduce((a,s)=>a+s.total,0);
  const cashExpected = (shift.openingCash||0) + paidSales.reduce((a,s)=>a+cashContribution(s),0);
  const counted = shift.closingCashCounted||0;
  const diff = counted - cashExpected;
  const fiadas = sales.filter(s=>s.fiado).length;
  const logs = auditInRange(shift.userId, shift.openedAt, shift.closedAt || new Date().toISOString());
  const eliminadas = logs.filter(l=>l.action==='venta_eliminada').length;
  return `
    <div style="text-align:center;font-weight:700;font-size:14px;">CORTE DE TURNO</div>
    <div style="text-align:center;font-size:11px;">${esc(state.settings.businessName)}</div>
    <div style="border-top:1px dashed #000;margin:4px 0;"></div>
    <div style="font-size:11px;">Cajero: ${esc(shift.userName)}<br>Apertura: ${new Date(shift.openedAt).toLocaleString('es-ES')}<br>Cierre: ${shift.closedAt ? new Date(shift.closedAt).toLocaleString('es-ES') : 'En curso'}</div>
    <div style="border-top:1px dashed #000;margin:6px 0;"></div>
    <div style="font-size:11px;font-weight:700;">VENTAS POR MÉTODO</div>
    ${Object.entries(totals).map(([k,v])=>`<div style="display:flex;justify-content:space-between;font-size:11px;"><span>${esc(k)}</span><span>${fmt(v)}</span></div>`).join('') || '<div style="font-size:11px;">Sin ventas cobradas</div>'}
    <div style="border-top:1px dashed #000;margin:6px 0;"></div>
    <div style="display:flex;justify-content:space-between;font-weight:700;font-size:12px;"><span>TOTAL VENDIDO</span><span>${fmt(grandTotal)}</span></div>
    <div style="display:flex;justify-content:space-between;font-size:11px;"><span>Propinas (no es ingreso, repartir a personal)</span><span>${fmt(tipsTotal(paidSales))}</span></div>
    <div style="display:flex;justify-content:space-between;font-size:11px;"><span>Descuentos otorgados</span><span>${fmt(discountsTotal(paidSales))}</span></div>
    ${deliveryCommissionsTotal(paidSales)>0?`<div style="display:flex;justify-content:space-between;font-size:11px;"><span>Comisiones de delivery</span><span>${fmt(deliveryCommissionsTotal(paidSales))}</span></div>`:''}
    <div style="border-top:1px dashed #000;margin:6px 0;"></div>
    <div style="font-size:11px;font-weight:700;">CUADRATURA DE CAJA</div>
    <div style="display:flex;justify-content:space-between;font-size:11px;"><span>Fondo inicial</span><span>${fmt(shift.openingCash)}</span></div>
    <div style="display:flex;justify-content:space-between;font-size:11px;"><span>Efectivo esperado</span><span>${fmt(cashExpected)}</span></div>
    <div style="display:flex;justify-content:space-between;font-size:11px;"><span>Efectivo contado</span><span>${fmt(counted)}</span></div>
    <div style="display:flex;justify-content:space-between;font-weight:700;font-size:12px;"><span>${diff<0?'FALTANTE':'SOBRANTE'}</span><span>${fmt(Math.abs(diff))}</span></div>
    <div style="border-top:1px dashed #000;margin:6px 0;"></div>
    <div style="font-size:11px;">Órdenes registradas: ${sales.length}<br>Órdenes a crédito: ${fiadas}<br>Órdenes eliminadas: ${eliminadas}</div>
    <div style="text-align:center;font-size:10px;margin-top:10px;">Firma cajero: ______________________</div>
  `;
}
function renderTurno(root){

  root.innerHTML = `
    <div class="font-display text-xl mb-4">Cortes de caja</div>
    <div class="surface rounded-xl p-5 mb-6 rule-top">

        <div class="font-display text-lg mb-2">No tienes un turno abierto</div>
        <div class="text-xs text-muted mb-3">Abre tu turno indicando el fondo inicial de caja (el efectivo con el que empiezas).</div>
        ${field('Fondo inicial (USD)', `<input id="openCashAmt" type="number" step="0.01" value="0" class="${inputCls} max-w-xs">`)}

      ` : `
        <div class="flex items-center justify-between mb-3">
          <div><div class="font-display text-lg">Turno abierto</div><div class="text-xs text-muted">Desde ${new Date(myShift.openedAt).toLocaleString('es-ES')}</div></div>
          <span class="badge text-[10px] px-2 py-1 rounded-full surface-2 basil">ABIERTO</span>
        </div>
        ${(()=>{ const sales = state.sales.filter(s=>s.shiftId===myShift.id && s.paid); const totals = paymentTotals(sales); const grand = sales.reduce((a,s)=>a+s.total,0); const cashExp = (myShift.openingCash||0)+sales.reduce((a,s)=>a+cashContribution(s),0);
          return `
          <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
            ${kpiCard('Ventas del turno', fmt(grand))}
            ${kpiCard('Órdenes cobradas', sales.length)}
            ${kpiCard('Efectivo esperado', fmt(cashExp))}
            ${kpiCard('Propinas (para el personal)', fmt(tipsTotal(sales)))}
          </div>
          <div class="text-xs text-muted uppercase tracking-wide mb-2">Desglose por método</div>
          <div class="grid grid-cols-2 md:grid-cols-3 gap-2 mb-4">${Object.entries(totals).map(([k,v])=>`<div class="surface-2 rounded-lg p-2.5 flex justify-between text-xs"><span>${esc(k)}</span><span class="font-mono">${fmt(v)}</span></div>`).join('') || '<div class="text-xs text-muted">Sin ventas aún</div>'}</div>
          `; })()}
        <button id="closeShiftBtn" class="px-5 py-2.5 rounded-lg text-white text-sm font-semibold" style="background:var(--red)">Cerrar turno (corte de caja)</button>
      `}
    </div>

    <div class="font-display text-lg mb-3">${caps().viewAllShifts ? 'Historial de cortes (todos los usuarios)' : 'Mi historial de cortes'}</div>
    <div class="surface rounded-xl overflow-hidden">
      <table class="w-full text-sm">
        <thead class="surface-2 text-muted text-left uppercase text-[11px]"><tr><th class="p-3">Cajero</th><th class="p-3">Apertura</th><th class="p-3">Cierre</th><th class="p-3">Estado</th><th class="p-3">Diferencia</th><th class="p-3"></th></tr></thead>
        <tbody>${history.map(s=>{
          const sales = state.sales.filter(x=>x.shiftId===s.id && x.paid);
          const cashExp = (s.openingCash||0)+sales.reduce((a,x)=>a+cashContribution(x),0);
          const diff = s.status==='cerrado' ? (s.closingCashCounted||0)-cashExp : null;
          return `<tr class="border-t border-line">
            <td class="p-3">${esc(s.userName)}</td><td class="p-3">${new Date(s.openedAt).toLocaleString('es-ES')}</td>
            <td class="p-3">${s.closedAt ? new Date(s.closedAt).toLocaleString('es-ES') : '—'}</td>
            <td class="p-3"><span class="badge text-[10px] px-2 py-1 rounded-full surface-2 ${s.status==='abierto'?'basil':''}">${s.status}</span></td>
            <td class="p-3 font-mono ${diff!=null && diff<0?'ember':''}">${diff!=null ? fmt(diff) : '—'}</td>
            <td class="p-3"><button data-print-shift="${s.id}" class="text-xs px-3 py-1.5 rounded-lg surface-2">Imprimir</button></td>
          </tr>`;
        }).join('') || `<tr><td class="p-3 text-muted" colspan="6">Aún no hay cortes registrados</td></tr>`}</tbody>
      </table>
    </div>
  `;

  document.getElementById('openShiftBtn')?.addEventListener('click', ()=>{
    const amt = parseFloat(document.getElementById('openCashAmt').value)||0;
    const shift = { id: uid('shift'), userId: state.settings.currentUserId, userName: state.settings.currentUserName, openedAt: new Date().toISOString(), closedAt:null, openingCash: amt, closingCashCounted:null, status:'abierto' };
    state.shifts.push(shift);
    logAudit('turno_abierto', `Fondo inicial ${fmt(amt)}`);
    saveState(); renderTurno(root); showToast('Turno abierto', 'basil');
  });
  document.getElementById('closeShiftBtn')?.addEventListener('click', ()=>{
    const sales = state.sales.filter(s=>s.shiftId===myShift.id && s.paid);
    const cashExp = (myShift.openingCash||0)+sales.reduce((a,s)=>a+cashContribution(s),0);
    const body = `
      <div class="text-sm mb-3">Cuenta el efectivo físico que hay en la caja ahora mismo.</div>
      <div class="text-xs text-muted mb-3">Efectivo esperado según el sistema: <span class="font-mono font-semibold">${fmt(cashExp)}</span></div>
      ${field('Efectivo contado (USD)', `<input id="countedCash" type="number" step="0.01" class="${inputCls}">`)}
      <div id="diffPreview" class="text-xs mb-3"></div>
      <button id="confirmCloseShift" class="w-full py-2.5 rounded-lg text-white text-sm font-semibold" style="background:var(--red)">Confirmar cierre de turno</button>
    `;
    const ov = openModal('Cerrar turno', body);
    ov.querySelector('#countedCash').addEventListener('input', (e)=>{
      const c = parseFloat(e.target.value)||0; const d = c-cashExp;
      ov.querySelector('#diffPreview').innerHTML = `<span style="color:${d<0?'var(--danger)':'var(--basil)'}">${d<0?'Faltante':'Sobrante'}: ${fmt(Math.abs(d))}</span>`;
    });
    ov.querySelector('#confirmCloseShift').addEventListener('click', ()=>{
      const counted = parseFloat(ov.querySelector('#countedCash').value);
      if(isNaN(counted)){ showToast('Ingresa el efectivo contado', 'danger'); return; }
      myShift.closingCashCounted = counted; myShift.closedAt = new Date().toISOString(); myShift.status = 'cerrado';
      logAudit('turno_cerrado', `Contado ${fmt(counted)} · Esperado ${fmt(cashExp)}`);
      saveState(); closeModal();
      printReceipt(shiftReportHTML(myShift), 'report');
      downloadBackup('cierre-turno');
      showToast('Turno cerrado y respaldo descargado', 'basil');
      renderTurno(root);
    });
  });
  document.querySelectorAll('[data-print-shift]').forEach(b=>b.addEventListener('click', ()=>{
    const s = state.shifts.find(x=>x.id===b.dataset.printShift);
    printReceipt(shiftReportHTML(s), 'report');
  }));
}

    renderReports(root);

  document.getElementById('exportPdf').addEventListener('click', exportFullPdf);

function renderReportTab(el){
  const sales = filteredSales(); const purchases = filteredPurchases();
  const activeFilters = reportsFilter.from||reportsFilter.to||reportsFilter.method||reportsFilter.table||reportsFilter.category;
  const filterNote = activeFilters ? `<div class="text-xs text-muted mb-3">Mostrando ${sales.length} venta(s) con los filtros aplicados</div>` : '';
  if(reportsTab==='resumen'){
    el.innerHTML = filterNote + `<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">${kpiCard('Ventas totales', fmt(sales.reduce((a,s)=>a+s.total,0)))}${kpiCard('Costo de ventas', fmt(cogsOf(sales)))}${kpiCard('Utilidad bruta', fmt(profitOf(sales)))}${kpiCard('Gastos (filtrados)', fmt(purchasesTotal(purchases)))}</div><div class="surface rounded-xl p-5"><div class="font-display text-lg mb-3">Ventas vs. utilidad · 7 días</div><canvas id="chartProfit" height="100"></canvas></div>`;
    const { labels, days } = last7DaysLabelsAndTotals();
    const rev = days.map(d=> state.sales.filter(s=>s.date===d && s.status!=='cancelada').reduce((a,s)=>a+s.total,0));
    const prof = days.map(d=> profitOf(state.sales.filter(s=>s.date===d && s.status!=='cancelada')));
    if(charts.profit) charts.profit.destroy();
    charts.profit = new Chart(document.getElementById('chartProfit'), { type:'bar', data:{ labels, datasets:[{ label:'Ventas', data:rev, backgroundColor:'#C81E2B', borderRadius:3 },{ label:'Utilidad', data:prof, backgroundColor:'#1F8E63', borderRadius:3 }]}, options:{ plugins:{legend:{labels:{color:'#7C7360'}}}, scales:{ y:{ticks:{color:'#7C7360'}, grid:{color:'rgba(124,115,96,.1)'}}, x:{ticks:{color:'#7C7360'}, grid:{display:false}} } } });
  }
  else if(reportsTab==='ventas'){
    el.innerHTML = filterNote + `<div class="surface rounded-xl overflow-hidden"><table class="w-full text-sm"><thead class="surface-2 text-muted text-left uppercase text-[11px]"><tr><th class="p-3">#</th><th class="p-3">Fecha</th><th class="p-3">Cliente</th><th class="p-3">Mesa</th><th class="p-3">Pago</th><th class="p-3">Total</th></tr></thead><tbody>${sales.slice().reverse().map(s=>`<tr class="border-t border-line"><td class="p-3">#${s.orderNumber}</td><td class="p-3">${s.date} ${s.time}</td><td class="p-3">${esc(s.customerName||'Mostrador')}</td><td class="p-3">${esc(s.tableName||'-')}</td><td class="p-3">${s.paymentMethod||'—'}</td><td class="p-3 font-mono">${fmt(s.total)}</td></tr>`).join('') || `<tr><td class="p-3 text-muted" colspan="6">Sin ventas con estos filtros</td></tr>`}</tbody></table></div>`;
  }
  else if(reportsTab==='compras'){
    el.innerHTML = filterNote + `<div class="surface rounded-xl overflow-hidden"><table class="w-full text-sm"><thead class="surface-2 text-muted text-left uppercase text-[11px]"><tr><th class="p-3">Fecha</th><th class="p-3">Concepto</th><th class="p-3">Categoría</th><th class="p-3">Pago</th><th class="p-3">Monto</th></tr></thead><tbody>${purchases.slice().reverse().map(p=>`<tr class="border-t border-line"><td class="p-3">${p.date}</td><td class="p-3">${esc(p.concept)}</td><td class="p-3">${esc(p.category)}</td><td class="p-3">${esc(p.method)}</td><td class="p-3 font-mono">${fmt(p.amount)}</td></tr>`).join('') || `<tr><td class="p-3 text-muted" colspan="5">Sin compras con estos filtros</td></tr>`}</tbody></table></div>`;
  }
  else if(reportsTab==='productos'){
    const stats = {}; sales.forEach(s=> s.items.forEach(i=>{ if(!stats[i.name]) stats[i.name] = { qty:0, revenue:0, profit:0 }; stats[i.name].qty += i.qty; stats[i.name].revenue += i.price*i.qty; stats[i.name].profit += (i.price-(i.cost||0))*i.qty; }));
    const rows = Object.entries(stats).sort((a,b)=>b[1].revenue-a[1].revenue);
    el.innerHTML = filterNote + `<div class="surface rounded-xl overflow-hidden"><table class="w-full text-sm"><thead class="surface-2 text-muted text-left uppercase text-[11px]"><tr><th class="p-3">Producto</th><th class="p-3">Cant.</th><th class="p-3">Ingresos</th><th class="p-3">Utilidad</th></tr></thead><tbody>${rows.map(([name,r])=>`<tr class="border-t border-line"><td class="p-3">${esc(name)}</td><td class="p-3">${r.qty}</td><td class="p-3 font-mono">${fmt(r.revenue)}</td><td class="p-3 font-mono basil">${fmt(r.profit)}</td></tr>`).join('') || `<tr><td class="p-3 text-muted" colspan="4">Sin ventas con estos filtros</td></tr>`}</tbody></table></div>`;
  }
  else if(reportsTab==='clientes'){
    const rows = state.customers.map(c=>{ const p = sales.filter(s=>s.customerId===c.id); return { name:c.name, visits:p.length, spent:p.reduce((a,s)=>a+s.total,0) }; }).filter(r=>!activeFilters || r.visits>0).sort((a,b)=>b.spent-a.spent);
    el.innerHTML = filterNote + `<div class="surface rounded-xl overflow-hidden"><table class="w-full text-sm"><thead class="surface-2 text-muted text-left uppercase text-[11px]"><tr><th class="p-3">Cliente</th><th class="p-3">Visitas</th><th class="p-3">Total gastado</th></tr></thead><tbody>${rows.map(r=>`<tr class="border-t border-line"><td class="p-3">${esc(r.name)}</td><td class="p-3">${r.visits}</td><td class="p-3 font-mono">${fmt(r.spent)}</td></tr>`).join('') || `<tr><td class="p-3 text-muted" colspan="3">Sin clientes con estos filtros</td></tr>`}</tbody></table></div>`;
  }
}
function exportFullPdf(){
  const sales = filteredSales(); const purchases = filteredPurchases();
  const { jsPDF } = window.jspdf; const doc = new jsPDF();
  doc.setFontSize(16); doc.text(`Reporte · ${state.settings.businessName}`, 14, 16);
  doc.setFontSize(9); doc.text(`Filtros: ${reportsFilter.from||'inicio'} a ${reportsFilter.to||'hoy'}${reportsFilter.method?' · Pago: '+reportsFilter.method:''}${reportsFilter.table?' · Mesa: '+reportsFilter.table:''}${reportsFilter.category?' · Categoría: '+reportsFilter.category:''}`, 14, 22);
  doc.autoTable({ startY:28, head:[['#Orden','Fecha','Cliente','Total','Pago','Estado']], body: sales.map(s=>[s.orderNumber, s.date, s.customerName||'Mostrador', fmt(s.total), s.paymentMethod||'—', s.status]) });
  let y = doc.lastAutoTable.finalY + 12;
  doc.setFontSize(14); doc.text('Compras', 14, y);
  doc.autoTable({ startY:y+4, head:[['Fecha','Concepto','Categoría','Monto']], body: purchases.map(p=>[p.date,p.concept,p.category,fmt(p.amount)]) });
  doc.save(`reporte-${todayStr()}.pdf`); showToast('PDF exportado');
}
function exportFullXlsx(){
  const sales = filteredSales(); const purchases = filteredPurchases();
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(sales.map(s=>({Orden:s.orderNumber,Fecha:s.date,Hora:s.time,Cliente:s.customerName||'',Mesa:s.tableName||'',Total:s.total,Pago:s.paymentMethod||'',Estado:s.status}))), 'Ventas');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(purchases.map(p=>({Fecha:p.date,Concepto:p.concept,Categoria:p.category,Metodo:p.method,Monto:p.amount}))), 'Compras');
  const stats = {}; sales.forEach(s=> s.items.forEach(i=>{ if(!stats[i.name]) stats[i.name]={qty:0,revenue:0}; stats[i.name].qty+=i.qty; stats[i.name].revenue+=i.price*i.qty; }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(Object.entries(stats).map(([n,r])=>({Producto:n,Cantidad:r.qty,Ingresos:r.revenue}))), 'Productos');
  XLSX.writeFile(wb, `reporte-${todayStr()}.xlsx`); showToast('Excel exportado');
}

        <button id="saveSettings" class="w-full py-2.5 rounded-lg bg-ember text-white text-sm font-semibold">Guardar cambios</button>
      </div>

      <div class="surface rounded-xl p-5">
        <div class="font-display text-lg mb-3">Bancos / plataformas</div>
        <div class="space-y-2 max-h-32 overflow-y-auto mb-3">${state.banks.map(b=>`<div class="flex items-center justify-between surface-2 rounded-lg px-3 py-2 text-sm"><span>${esc(b.name)}</span><button data-del-bank="${b.id}" class="text-red-500 text-xs">Eliminar</button></div>`).join('')}</div>
        <div class="flex gap-2"><input id="newBank" class="${inputCls}" placeholder="Nombre del banco"><button id="addBank" class="px-4 rounded-lg bg-ember text-white text-sm">+</button></div>

        <div class="font-display text-lg mb-3 mt-6">Categorías de gasto</div>
        <div class="space-y-2 max-h-32 overflow-y-auto mb-3">${state.expenseCategories.map(c=>`<div class="flex items-center justify-between surface-2 rounded-lg px-3 py-2 text-sm"><span>${esc(c.name)}</span><button data-del-cat="${c.id}" class="text-red-500 text-xs">Eliminar</button></div>`).join('')}</div>
        <div class="flex gap-2"><input id="newCat" class="${inputCls}" placeholder="Nueva categoría"><button id="addCat" class="px-4 rounded-lg bg-ember text-white text-sm">+</button></div>
      </div>
    </div>

    <div class="surface rounded-xl p-5 mb-6">
      <div class="font-display text-lg mb-1">Plantillas de WhatsApp</div>
      <div class="text-xs text-muted mb-3">Usa {nombre}, {orden}, {total} y {negocio} — se reemplazan automáticamente.</div>
      ${field('Pedido listo', `<textarea id="wtReady" rows="2" class="${inputCls}">${esc(wt.ready)}</textarea>`)}
      ${field('Pedido en camino', `<textarea id="wtOnway" rows="2" class="${inputCls}">${esc(wt.onway)}</textarea>`)}
      ${field('Agradecimiento', `<textarea id="wtThanks" rows="2" class="${inputCls}">${esc(wt.thanks)}</textarea>`)}
      <button id="saveTemplates" class="w-full py-2.5 rounded-lg bg-ember text-white text-sm font-semibold">Guardar plantillas</button>
    </div>

    <div class="surface rounded-xl p-5 mb-6">
      <div class="font-display text-lg mb-3">Descuentos, propinas y lealtad</div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
        ${field('Descuento máximo sin autorización (%)', `<input id="setDiscThresh" type="number" step="1" min="0" max="100" value="${state.settings.discountAuthThreshold}" class="${inputCls}">`)}
        ${field('Puntos ganados por cada $1', `<input id="setLoyaltyPerDollar" type="number" step="0.1" min="0" value="${state.settings.loyaltyPerDollar}" class="${inputCls}">`)}
        ${field('Valor de 1 punto al canjear (USD)', `<input id="setLoyaltyValue" type="number" step="0.01" min="0" value="${state.settings.loyaltyPointValue}" class="${inputCls}">`)}
      </div>
      <label class="flex items-center gap-2 text-sm mb-3"><input type="checkbox" id="loyaltyEnabledChk" ${state.settings.loyaltyEnabled?'checked':''}> Programa de lealtad activo (ganar y canjear puntos)</label>
      <div class="font-display text-base mb-2 mt-2">Canales de venta / delivery y su comisión</div>
      <div class="space-y-2 mb-3">${state.settings.deliveryChannels.map((ch,idx)=>`
        <div class="flex items-center gap-2 surface-2 rounded-lg px-3 py-2">
          <span class="text-sm flex-1">${esc(ch.name)}</span>
          <input data-channel-comm="${idx}" type="number" step="1" min="0" max="100" value="${ch.commissionPct}" class="w-20 rounded-md px-2 py-1.5 text-xs text-right">
          <span class="text-xs text-muted">% comisión</span>
        </div>`).join('')}</div>
      <button id="saveLoyaltySettings" class="w-full py-2.5 rounded-lg bg-ember text-white text-sm font-semibold">Guardar</button>
    </div>

    <div class="surface rounded-xl p-5 mb-6">
      <div class="flex items-center justify-between mb-1">
        <div class="font-display text-lg">Impresoras</div>
        <span id="qzStatus" class="badge text-[10px] px-2 py-1 rounded-full surface-2 text-muted">${window.nativePrint?'Impresión directa disponible':'Sin conectar'}</span>
      </div>
      <div class="text-xs text-muted mb-3">${window.nativePrint
        ? 'Elige abajo qué impresora usa cada ticket. En cuanto la elijas, ese ticket se manda directo a esa impresora — sin ningún diálogo ni programa adicional que instalar.'
        : 'Esto no se está ejecutando dentro de la app instalada, así que la impresión directa automática no está disponible aquí. Alternativa: instala la app gratuita <strong>QZ Tray</strong> — <a href="https://qz.io/download/" target="_blank" class="ember underline">qz.io/download</a> — y conéctate abajo.'}</div>
      <label class="flex items-center gap-2 text-sm mb-3">
        <input type="checkbox" id="directPrintChk" ${state.settings.printers?.directPrint?'checked':''}> Imprimir directo sin preguntar (si está apagado, siempre se abre el diálogo de impresión)
      </label>
      <button id="qzConnectBtn" class="px-4 py-2 rounded-lg surface-2 text-xs font-semibold mb-3">${window.nativePrint ? '🔄 Actualizar lista de impresoras' : 'Conectar y buscar impresoras (QZ Tray)'}</button>
      <div id="printerSelects" class="grid grid-cols-1 md:grid-cols-3 gap-3"></div>
      ${!window.nativePrint ? `<div class="text-[11px] text-muted mt-3">Alternativa sin instalar nada: abre este sistema en Chrome con el acceso directo modificado agregando <span class="font-mono">--kiosk-printing</span> al final; así imprime directo a tu impresora predeterminada sin preguntar, aunque sin poder elegir impresora distinta por ticket.</div>` : ''}
    </div>

    <div class="surface rounded-xl p-5 mb-6">
      <div class="font-display text-lg mb-1">Respaldo de datos</div>
      <div class="text-xs text-muted mb-3">El sistema descarga un respaldo automáticamente al cerrar cada turno y al cerrar sesión. También puedes generarlo cuando quieras.</div>
      <button id="manualBackupBtn" class="px-4 py-2 rounded-lg surface-2 text-sm font-semibold">⬇️ Descargar respaldo ahora</button>
    </div>

    ${state.settings.currentRole==='admin' ? `
    <div class="surface rounded-xl p-5 mb-6" style="border:1px dashed var(--border)">
      <div class="font-display text-lg mb-1">🧪 Datos de prueba</div>
      <div class="text-xs text-muted mb-3">Carga productos, categorías, clientes, mesas y ventas de ejemplo para probar el sistema (POS, Reportes, etc.) sin usar datos reales. Todo queda marcado como "de prueba" para poder borrarlo después sin afectar nada real que hayas registrado tú.</div>
      ${state.settings.demoDataLoaded ? `<div class="text-xs ember mb-3">● Hay datos de prueba cargados actualmente.</div>` : ''}
      <div class="flex gap-2">
        <button id="loadDemoBtn" class="flex-1 py-2.5 rounded-lg surface-2 text-sm font-semibold">Cargar datos de prueba</button>
        <button id="clearDemoBtn" class="flex-1 py-2.5 rounded-lg text-sm font-semibold text-white" style="background:var(--danger)" ${state.settings.demoDataLoaded?'':'disabled'}>Borrar datos de prueba</button>
      </div>
    </div>` : ''}

    <div class="flex items-center justify-between mb-4"><div class="font-display text-xl">Mesas registradas</div></div>
    <div class="flex flex-wrap gap-2">${state.tables.map(t=>`<span class="px-3 py-1.5 rounded-full surface-2 text-xs">${esc(t.name)}</span>`).join('') || `<span class="text-xs text-muted">Sin mesas. Ve a la sección "Mesas" para agregar.</span>`}</div>
  `;

  document.getElementById('logoUpload').addEventListener('change', (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{ state.settings.logoImage = reader.result; saveState(); renderSettings(root); showToast('Logo actualizado', 'basil'); };
    reader.readAsDataURL(file);
  });
  document.getElementById('saveSettings').addEventListener('click', ()=>{
    state.settings.businessName = document.getElementById('setName').value || 'Mi Food Truck';
    state.settings.businessPhone = document.getElementById('setPhone').value;
    state.settings.businessAddress = document.getElementById('setAddr').value;
    state.settings.dailyGoal = parseFloat(document.getElementById('setGoal').value) || 100;
    saveState(); render(); showToast('Ajustes guardados', 'basil');
  });
  document.getElementById('saveTemplates').addEventListener('click', ()=>{
    state.settings.waTemplates = { ready: document.getElementById('wtReady').value, onway: document.getElementById('wtOnway').value, thanks: document.getElementById('wtThanks').value };
    saveState(); showToast('Plantillas guardadas', 'basil');
  });
  document.getElementById('saveLoyaltySettings').addEventListener('click', ()=>{
    state.settings.discountAuthThreshold = parseFloat(document.getElementById('setDiscThresh').value) || 0;
    state.settings.loyaltyPerDollar = parseFloat(document.getElementById('setLoyaltyPerDollar').value) || 0;
    state.settings.loyaltyPointValue = parseFloat(document.getElementById('setLoyaltyValue').value) || 0;
    state.settings.loyaltyEnabled = document.getElementById('loyaltyEnabledChk').checked;
    document.querySelectorAll('[data-channel-comm]').forEach(inp=>{
      const idx = parseInt(inp.dataset.channelComm);
      if(state.settings.deliveryChannels[idx]) state.settings.deliveryChannels[idx].commissionPct = parseFloat(inp.value)||0;
    });
    saveState(); showToast('Configuración guardada', 'basil');
  });
  document.getElementById('addBank').addEventListener('click', ()=>{ const name = document.getElementById('newBank').value.trim(); if(!name) return; state.banks.push({ id: uid('bank'), name }); saveState(); renderSettings(root); });
  document.querySelectorAll('[data-del-bank]').forEach(b=>b.addEventListener('click', ()=>{ state.banks = state.banks.filter(x=>x.id!==b.dataset.delBank); saveState(); renderSettings(root); }));
  document.getElementById('addCat').addEventListener('click', ()=>{ const name = document.getElementById('newCat').value.trim(); if(!name) return; state.expenseCategories.push({ id: uid('cat'), name }); saveState(); renderSettings(root); });
  document.querySelectorAll('[data-del-cat]').forEach(b=>b.addEventListener('click', ()=>{ state.expenseCategories = state.expenseCategories.filter(x=>x.id!==b.dataset.delCat); saveState(); renderSettings(root); }));

  document.getElementById('manualBackupBtn').addEventListener('click', ()=>{ downloadBackup('manual'); showToast('Respaldo descargado', 'basil'); });
  document.getElementById('loadDemoBtn')?.addEventListener('click', ()=>{
    const ov = openModal('Cargar datos de prueba', `<div class="text-sm mb-4">Esto agrega productos, categorías, clientes, mesas y ventas de ejemplo para que puedas probar el sistema. No borra nada real que ya tengas. ¿Continuar?</div><button id="confirmLoadDemo" class="w-full py-2.5 rounded-lg bg-ember text-white text-sm font-semibold">Cargar datos de prueba</button>`);
    ov.querySelector('#confirmLoadDemo').addEventListener('click', ()=>{ loadDemoData(); closeModal(); renderSettings(root); showToast('Datos de prueba cargados', 'basil'); });
  });
  document.getElementById('clearDemoBtn')?.addEventListener('click', ()=>{
    const ov = openModal('Borrar datos de prueba', `<div class="text-sm mb-4">Esto elimina TODOS los productos, categorías, clientes, mesas y ventas marcados como "de prueba", dejando el sistema en cero para empezar con tus datos reales. Tus datos reales no se tocan. ¿Continuar?</div><button id="confirmClearDemo" class="w-full py-2.5 rounded-lg text-white text-sm font-semibold" style="background:var(--danger)">Borrar datos de prueba</button>`);
    ov.querySelector('#confirmClearDemo').addEventListener('click', ()=>{ clearDemoData(); closeModal(); renderSettings(root); showToast('Datos de prueba eliminados', 'basil'); });
  });
  document.getElementById('directPrintChk').addEventListener('change', (e)=>{
    state.settings.printers = { ...state.settings.printers, directPrint: e.target.checked }; saveState();
  });
  /* `list` es un arreglo de {value, label} — value es lo que se guarda y se usa para
     imprimir, label es lo que ve el usuario en el desplegable. */
  function renderPrinterSelects(list){
    const p = state.settings.printers || {};
    const wrap = document.getElementById('printerSelects');
    const opts = (current)=> list
      ? `<option value="">Sin asignar</option>${list.map(o=>`<option value="${esc(o.value)}" ${current===o.value?'selected':''}>${esc(o.label)}</option>`).join('')}`
      : `<option value="">${current ? esc(current) : 'Sin impresoras detectadas'}</option>`;
    wrap.innerHTML = `
      <div><label class="text-[11px] text-muted block mb-1">Ticket de cocina</label><select id="prnKitchen" class="${inputCls}">${opts(p.kitchenPrinter)}</select></div>
      <div><label class="text-[11px] text-muted block mb-1">Recibo de cliente</label><select id="prnCustomer" class="${inputCls}">${opts(p.customerPrinter)}</select></div>
      <div><label class="text-[11px] text-muted block mb-1">Cortes de caja / reportes</label><select id="prnReport" class="${inputCls}">${opts(p.reportPrinter)}</select></div>
    `;
    ['prnKitchen','prnCustomer','prnReport'].forEach((id,idx)=>{
      const key = ['kitchenPrinter','customerPrinter','reportPrinter'][idx];
      document.getElementById(id).addEventListener('change', (e)=>{
        // Elegir una impresora activa automáticamente la impresión directa — es lo que
        // se espera al "preseleccionarla": que desde ese momento imprima sola, sin pasos extra.
        const turnOnDirect = !!e.target.value;
        state.settings.printers = { ...state.settings.printers, [key]: e.target.value, directPrint: turnOnDirect ? true : state.settings.printers?.directPrint };
        if(turnOnDirect) document.getElementById('directPrintChk').checked = true;
        saveState();
      });
    });
  }
  async function loadNativePrinters(){
    const statusEl = document.getElementById('qzStatus');
    statusEl.textContent = 'Buscando impresoras…';
    try{
      const printers = await window.nativePrint.list();
      const list = (printers||[]).map(p=>({ value: p.name, label: p.displayName + (p.isDefault?' (predeterminada)':'') }));
      renderPrinterSelects(list);
      statusEl.textContent = list.length ? list.length+' impresora(s) encontradas' : 'No se detectaron impresoras';
      statusEl.classList.toggle('basil', list.length>0);
    }catch(e){
      console.error('No se pudo listar impresoras:', e);
      statusEl.textContent = 'No se pudo obtener la lista';
      renderPrinterSelects(null);
    }
  }
  if(window.nativePrint){
    loadNativePrinters();
    document.getElementById('qzConnectBtn').addEventListener('click', loadNativePrinters);
  } else {
    renderPrinterSelects(null);
    document.getElementById('qzConnectBtn').addEventListener('click', async ()=>{
      const statusEl = document.getElementById('qzStatus');
      statusEl.textContent = 'Conectando…';
      const found = await qzListPrinters();
      if(found){
        statusEl.textContent = 'Conectado ✔'; statusEl.classList.add('basil');
        renderPrinterSelects(found.map(n=>({ value:n, label:n })));
        showToast('QZ Tray conectado, '+found.length+' impresora(s) encontradas', 'basil');
      } else {
        statusEl.textContent = 'No se pudo conectar';
        showToast('No se detectó QZ Tray abierto en esta computadora', 'danger');
      }
    });
  }
}

loadState();
</script>
</body>
</html>
